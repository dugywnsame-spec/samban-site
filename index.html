  {k:"sakura",n:"벚꽃",d:"꽃잎이 흩날려요",accent:"sakura",fx:"sakura",sw:"#E58FAE"},
  {k:"maple",n:"단풍",d:"가을 낙엽",accent:"sunset",fx:"maple",sw:"#D2691E"},
  {k:"snow",n:"첫눈",d:"소복소복 눈",accent:"ocean",fx:"snow",sw:"#7FA7D9"},
  {k:"rain",n:"비 오는 날",d:"빗줄기와 물결",accent:"ink",fx:"rain",sw:"#5E6B78"},
  {k:"night",n:"별밤",d:"반짝이는 별과 별똥별",accent:"night",mode:"dark",fx:"stars",sw:"#2C3E73"},
  {k:"aurora",n:"오로라",d:"일렁이는 빛",accent:"grape",fx:"aurora",sw:"#7B5CC4"},
  {k:"party",n:"축제",d:"색종이 축하",accent:"green",fx:"confetti",sw:"#F2C64B"},
  {k:"weather",n:"실시간 날씨",d:"공도 날씨에 맞춰 자동",fx:"weather",sw:"#4A90C2"}
];
const FX={ cv:null, ctx:null, kind:null, parts:[], raf:0, w:0, h:0, dpr:1, flash:0, burst:[] };
function fxKind(){
  const p=themePref(), pr=PRESETS.find(x=>x.k===(p.preset||"basic"))||PRESETS[0];
  if(p.motion==="off") return null;
  if(pr.fx==="weather") return (S.weather&&S.weather.fx)||null;
  return pr.fx||null;
}
function fxInit(){
  if(!FX.cv){ FX.cv=document.createElement("canvas"); FX.cv.id="fx"; FX.cv.setAttribute("aria-hidden","true"); document.body.appendChild(FX.cv); FX.ctx=FX.cv.getContext("2d");
    addEventListener("resize",fxResize); document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(FX.raf); else fxLoop(); }); }
  fxResize(); fxSet(fxKind());
}
function fxResize(){ if(!FX.cv) return; FX.dpr=Math.min(2,devicePixelRatio||1); FX.vw=innerWidth; FX.vh=innerHeight; if(!FX.soft){ FX.w=FX.vw; FX.h=FX.vh; } FX.cv.width=FX.vw*FX.dpr; FX.cv.height=FX.vh*FX.dpr; FX.ctx.setTransform(FX.dpr,0,0,FX.dpr,0,0); }
/* 은은하게: 홈 맨 위 날짜 칸(hero) 안에서만 그려요 */
function fxHeroBox(){ const el=document.querySelector(".hero"); if(!el) return null; const r=el.getBoundingClientRect(); if(r.bottom<0||r.top>FX.vh||r.width<10) return null; return r; }
const rnd=(a,b)=>a+Math.random()*(b-a);
function fxSpawn(k,init){
  const p=fxSpawn0(k,init); if(!p) return p; const m=FX.sp||1;
  for(const key of ["vx","vy","vr","va"]) if(key in p) p[key]*=m;
  return p;
}
function fxSpawn0(k,init){
  const w=FX.w,h=FX.h, y=init?rnd(0,h):rnd(-40,-10);
  if(k==="sakura") return {x:rnd(0,w),y,s:rnd(6,11),vx:rnd(-.3,.6),vy:rnd(.5,1.2),r:rnd(0,6.3),vr:rnd(-.03,.03),sw:rnd(0,6.3)};
  if(k==="maple") return {x:rnd(0,w),y,s:rnd(9,15),vx:rnd(-.5,.5),vy:rnd(.7,1.5),r:rnd(0,6.3),vr:rnd(-.04,.04),sw:rnd(0,6.3),c:["#D2691E","#E2A33B","#B8402E","#C9752B"][Math.random()*4|0]};
  if(k==="snow") return {x:rnd(0,w),y,s:rnd(1.5,4),vx:rnd(-.3,.3),vy:rnd(.4,1.3),sw:rnd(0,6.3)};
  if(k==="rain"||k==="thunder") return {x:rnd(-50,w),y:init?rnd(0,h):rnd(-h*.3,0),l:rnd(10,20),vy:rnd(9,14),vx:1.6};
  if(k==="stars") return {x:rnd(0,w),y:rnd(0,h),s:rnd(.6,1.8),a:rnd(0,6.3),va:rnd(.01,.04)};
  if(k==="confetti") return {x:rnd(0,w),y,s:rnd(5,9),vx:rnd(-.8,.8),vy:rnd(1,2.2),r:rnd(0,6.3),vr:rnd(-.12,.12),c:["#F2C64B","#E86A5A","#4A90C2","#5BB98B","#B07CD8"][Math.random()*5|0]};
  if(k==="sun") return {x:rnd(0,w),y:rnd(0,h),s:rnd(1,2.6),vy:rnd(-.25,-.05),vx:rnd(-.1,.1),a:rnd(0,6.3)};
  if(k==="cloud"||k==="fog") return {x:init?rnd(-200,w):rnd(-320,-200),y:k==="fog"?rnd(h*.3,h):rnd(20,h*.45),s:rnd(80,160),vx:rnd(.15,.4)};
  return null;
}
const FX_COUNT={sakura:24,maple:18,snow:70,rain:90,thunder:90,stars:90,confetti:40,sun:30,cloud:6,fog:7};
const FX_SOFT={sakura:6,maple:5,snow:22,rain:16,thunder:16,stars:26,confetti:7,sun:10,cloud:2,fog:2};
function fxFill(){
  const k=FX.kind; FX.parts=[];
  const n=FX.soft?Math.round((FX_SOFT[k]||8)*(FX.w<600?.6:1)):Math.round((FX_COUNT[k]||30)*(FX.w<600?.5:.6));
  for(let i=0;i<n;i++){ const p=fxSpawn(k,true); if(p){ p.age=60; FX.parts.push(p); } }
}
function fxSet(k){
  document.documentElement.dataset.fx=k||"";
  FX.kind=k; FX.parts=[]; FX.flash=0; FX.shoot=null; cancelAnimationFrame(FX.raf);
  if(FX.ctx) FX.ctx.clearRect(0,0,FX.vw||innerWidth,FX.vh||innerHeight);
  const live=themePref().motion==="live"; FX.soft=!live; FX.sp=live?.7:.35;
  const r=document.documentElement, dark=r.dataset.theme==="dark"||(r.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  FX.lightBg=live&&!dark;   /* 생생하게는 밝은 배경 위라 눈·별 색을 조금 진하게 */
  if(!k||k==="aurora"){ if(FX.burst.length) fxLoop(); return; }
  if(FX.soft){ const hb=fxHeroBox(); FX.w=hb?hb.width:(FX.vw||innerWidth); FX.h=hb?hb.height:200; }
  else { FX.w=FX.vw||innerWidth; FX.h=FX.vh||innerHeight; }
  fxFill();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ fxDraw(true); return; }
  fxLoop();
}
function fxLoop(){ cancelAnimationFrame(FX.raf); if(!FX.kind&&!FX.burst.length) { FX.ctx&&FX.ctx.clearRect(0,0,FX.vw,FX.vh); return; } fxDraw(false); FX.raf=requestAnimationFrame(fxLoop); }
function petal(c,x,y,s,r,col){ c.save(); c.translate(x,y); c.rotate(r); c.fillStyle=col; c.beginPath(); c.moveTo(0,-s); c.bezierCurveTo(s*.9,-s*.6,s*.7,s*.6,0,s); c.bezierCurveTo(-s*.7,s*.6,-s*.9,-s*.6,0,-s); c.fill(); c.restore(); }
function leaf(c,x,y,s,r,col){ c.save(); c.translate(x,y); c.rotate(r); c.fillStyle=col; c.beginPath(); for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5, b=a+Math.PI/5; c.lineTo(Math.cos(a)*s,Math.sin(a)*s); c.lineTo(Math.cos(b)*s*.45,Math.sin(b)*s*.45); } c.closePath(); c.fill(); c.restore(); }
function fxDraw(still){
  const c=FX.ctx, k=FX.kind; if(!c) return;
  c.clearRect(0,0,FX.vw,FX.vh);
  let box=null;
  if(k&&FX.soft){ box=fxHeroBox();
    if(box&&(Math.abs(box.width-FX.w)>30||Math.abs(box.height-FX.h)>30)){ FX.w=box.width; FX.h=box.height; fxFill(); } }
  const w=FX.w, h=FX.h, drawParts=k&&(!FX.soft||box);
  c.save();
  if(drawParts&&box){ c.translate(box.left,box.top); c.beginPath(); c.rect(0,0,w,h); c.clip(); }
  for(let i=0;drawParts&&i<FX.parts.length;i++){ const p=FX.parts[i];
    p.age=(p.age||0)+1; const fd=Math.min(1,p.age/60, k==="stars"||k==="sun"||k==="cloud"||k==="fog"?1:Math.max(0,(h+10-p.y)/40));   /* 천천히 나타나고 바닥에서 스르르 사라지게 */
    if(k==="sakura"){ p.sw+=.02; p.x+=p.vx+Math.sin(p.sw)*.6; p.y+=p.vy; p.r+=p.vr; c.globalAlpha=(.8)*fd; petal(c,p.x,p.y,p.s,p.r,"#F4A9C0"); }
    else if(k==="maple"){ p.sw+=.02; p.x+=p.vx+Math.sin(p.sw)*.8; p.y+=p.vy; p.r+=p.vr; c.globalAlpha=(.85)*fd; leaf(c,p.x,p.y,p.s,p.r,p.c); }
    else if(k==="snow"){ p.sw+=.02; p.x+=p.vx+Math.sin(p.sw)*.3; p.y+=p.vy; c.globalAlpha=(.85)*fd; c.fillStyle=FX.lightBg?"#B9CDE8":"#FFFFFF"; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); c.globalAlpha=(.25)*fd; c.strokeStyle="#8AA4C8"; c.stroke(); }
    else if(k==="rain"||k==="thunder"){ p.x+=p.vx; p.y+=p.vy; c.globalAlpha=(.45)*fd; c.strokeStyle="#7F97B2"; c.lineWidth=1.2; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*1.5,p.y-p.l); c.stroke(); }
    else if(k==="stars"){ p.a+=p.va; c.globalAlpha=(.35+.65*Math.abs(Math.sin(p.a)))*fd; c.fillStyle=FX.lightBg?"#D9C27A":"#FFF6D8"; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); }
    else if(k==="confetti"){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; c.globalAlpha=(.9)*fd; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c.restore(); }
    else if(k==="sun"){ p.a+=.03; p.x+=p.vx; p.y+=p.vy; c.globalAlpha=(.25+.35*Math.abs(Math.sin(p.a)))*fd; c.fillStyle="#F2C64B"; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); }
    else if(k==="cloud"||k==="fog"){ p.x+=p.vx; const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s); const col=k==="fog"?"200,208,214":"235,240,245"; g.addColorStop(0,`rgba(${col},${k==="fog"?.22:.5})`); g.addColorStop(1,`rgba(${col},0)`); c.globalAlpha=(1)*fd; c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,p.s,0,7); c.fill(); }
    if(!still){
      const out = (k==="cloud"||k==="fog") ? p.x-p.s>w : (k==="stars"||k==="sun") ? (k==="sun"&&p.y<-10) : p.y>h+20||p.x>w+40||p.x<-60;
      if(out){ const np=fxSpawn(k,false); if(np) FX.parts[i]=np; if(k==="sun") FX.parts[i].y=h+10; }
    }
  }
  c.restore();
  if(drawParts&&k==="stars"&&!still){ if(!FX.shoot&&!FX.soft&&Math.random()<.004) FX.shoot={x:rnd(w*.2,w),y:rnd(0,h*.4),t:0}; if(FX.shoot){ const s=FX.shoot; s.t+=1; c.globalAlpha=Math.max(0,1-s.t/40); c.strokeStyle="#FFFFFF"; c.lineWidth=1.6; c.beginPath(); c.moveTo(s.x-s.t*7,s.y+s.t*3); c.lineTo(s.x-s.t*7+40,s.y+s.t*3-17); c.stroke(); if(s.t>40) FX.shoot=null; } }
  /* 축하 폭죽 (자리 뽑기 끝, 생일 축하) */
  for(let i=FX.burst.length-1;i>=0;i--){ const p=FX.burst[i]; p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--; c.globalAlpha=Math.max(0,p.life/90); c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.c; c.fillRect(-4,-2,8,4); c.restore(); if(p.life<=0){ FX.burst.splice(i,1); if(!FX.burst.length) FX.cv.style.zIndex=""; } }
  c.globalAlpha=1;
}
function fxBurst(){
  if(!FX.ctx||themePref().motion==="off"||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<70;i++){ const a=rnd(0,Math.PI*2), v=rnd(3,8); FX.burst.push({x:FX.vw/2,y:FX.vh*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:rnd(0,6),vr:rnd(-.2,.2),life:rnd(60,100),c:["#F2C64B","#E86A5A","#4A90C2","#5BB98B","#B07CD8"][i%5]}); }
  FX.cv.style.zIndex="45";   /* 축하할 때만 잠깐 맨 위로 */
  if(!FX.kind||FX.kind==="aurora") fxLoop();
}
/* 실시간 날씨: 학교(안성 공도) 근처 */
const WX_NAMES={0:["맑음","sun"],1:["대체로 맑음","sun"],2:["구름 조금","cloud"],3:["흐림","cloud"],45:["안개","fog"],48:["안개","fog"],51:["이슬비","rain"],53:["이슬비","rain"],55:["이슬비","rain"],56:["어는 비","rain"],57:["어는 비","rain"],61:["비","rain"],63:["비","rain"],65:["강한 비","rain"],66:["어는 비","rain"],67:["어는 비","rain"],71:["눈","snow"],73:["눈","snow"],75:["많은 눈","snow"],77:["싸락눈","snow"],80:["소나기","rain"],81:["소나기","rain"],82:["강한 소나기","rain"],85:["눈 소나기","snow"],86:["눈 소나기","snow"],95:["뇌우","thunder"],96:["뇌우","thunder"],99:["뇌우","thunder"]};
async function loadWeather(){
  try{ const c=JSON.parse(localStorage.getItem("class13-wx")||"null"); if(c&&Date.now()-c.t<30*60e3){ S.weather=c.v; return; } }catch(e){}
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.0&longitude=127.17&current=temperature_2m,weather_code,is_day&timezone=Asia%2FSeoul");
    const j=await r.json(), code=j.current.weather_code, [name,fx]=WX_NAMES[code]||["날씨","cloud"];
    S.weather={temp:Math.round(j.current.temperature_2m),name,fx:fx==="sun"&&!j.current.is_day?"stars":fx};
    try{ localStorage.setItem("class13-wx",JSON.stringify({t:Date.now(),v:S.weather})); }catch(e){}
  }catch(e){ S.weather=null; }
}
async function applyFx(){
  const p=themePref();
  if(p.preset==="weather"&&!S.weather) await loadWeather();
  fxSet(fxKind()); if(S.ready&&S.view==="home") render();
}
const wxChip=()=>{ const p=themePref(); return p.preset==="weather"&&S.weather?`<span class="wxchip" title="안성 공도 기준">${{sun:"☀️",cloud:"☁️",fog:"🌫️",rain:"🌧️",snow:"❄️",thunder:"⛈️",stars:"🌙"}[S.weather.fx]||"🌤️"} 공도 ${S.weather.temp}° ${esc(S.weather.name)}</span>`:""; };

function go(v){
  if(!VIEWS[v]) v="home";
  S.view=v;
  if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  render(); window.scrollTo({top:0});
}
window.addEventListener("hashchange",()=>{ const v=location.hash.slice(1); if(v&&v!==S.view&&VIEWS[v]) go(v); });

/* ---------- 시작 ---------- */

    $("#main").innerHTML=`<div class="empty"><b>서버에 연결하지 못했어요</b>설정(SUPABASE_URL, 키)이 맞는지, 인터넷이 연결돼 있는지 확인해 주세요.</div>`;

  setInterval(()=>{ if((S.view==="home"||S.view==="perf")&&!$("#modalRoot").innerHTML&&!document.activeElement?.matches("input,textarea")) render(); },60000);
  { let d=today(); const w=parseD(d).getDay(); loadMeal(d); }
