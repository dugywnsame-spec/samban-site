<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>1-3 우리반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 칠판색 상단 띠 + 넓은 화면은 상단 메뉴, 좁은 화면은 하단 탭바. 본문은 카드형 패널 그리드 */
:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --sunk:#EBF0EC; --ink:#1B2421; --muted:#5B6863; --line:#DCE3DE;
  --board:#1D5A4D; --board-ink:#FFFFFF; --chalk:#F2C64B; --chalk-ink:#3A2B00;
  --danger:#B83A26; --danger-bg:#FBE9E5;
  --chip-s:68%; --chip-bg-l:91%; --chip-fg-l:29%; --chip-mid-l:46%;
  --shadow:0 1px 2px rgb(22 36 30 / .05), 0 6px 18px rgb(22 36 30 / .06);
  --scrim:rgb(14 22 19 / .55);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111715; --surface:#19211E; --sunk:#141B18; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --board:#1F4F44; --board-ink:#F2F6F4; --chalk:#E8BE45; --chalk-ink:#2E2300;
  --danger:#EE7A64; --danger-bg:#3A1F1A;
  --chip-s:42%; --chip-bg-l:23%; --chip-fg-l:82%; --chip-mid-l:62%;
  --shadow:none; --scrim:rgb(0 0 0 / .65); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111715; --surface:#19211E; --sunk:#141B18; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --board:#1F4F44; --board-ink:#F2F6F4; --chalk:#E8BE45; --chalk-ink:#2E2300;
  --danger:#EE7A64; --danger-bg:#3A1F1A;
  --chip-s:42%; --chip-bg-l:23%; --chip-fg-l:82%; --chip-mid-l:62%;
  --shadow:none; --scrim:rgb(0 0 0 / .65); color-scheme:dark;}

/* 색 테마: 상단 띠·버튼 색만 바뀜 */
:root[data-accent="ocean"]{--board:#1F4E8C}
:root[data-accent="sunset"]{--board:#A9432A}
:root[data-accent="grape"]{--board:#5B3F8C}
:root[data-accent="ink"]{--board:#2B3035}
@media (prefers-color-scheme: dark){
  :root[data-accent="ocean"]:not([data-theme="light"]){--board:#244A75}
  :root[data-accent="sunset"]:not([data-theme="light"]){--board:#7E3524}
  :root[data-accent="grape"]:not([data-theme="light"]){--board:#46336A}
  :root[data-accent="ink"]:not([data-theme="light"]){--board:#353C42}}
:root[data-accent="ocean"][data-theme="dark"]{--board:#244A75}
:root[data-accent="sunset"][data-theme="dark"]{--board:#7E3524}
:root[data-accent="grape"][data-theme="dark"]{--board:#46336A}
:root[data-accent="ink"][data-theme="dark"]{--board:#353C42}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--board)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:var(--board)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prose a{color:var(--chalk)}}
:root[data-theme="dark"] .prose a{color:var(--chalk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--board);color:var(--board-ink)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:23px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--chalk);color:var(--chalk-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 8px;border-radius:6px;flex:none}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{color:inherit;opacity:.75;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14.5px;white-space:nowrap}
.nav a:hover{opacity:1}
.nav a.on{opacity:1;background:rgb(255 255 255 / .12);box-shadow:inset 0 -2px 0 var(--chalk)}
.auth{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.top .btn-line{background:transparent;border:1px solid rgb(255 255 255 / .35);color:var(--board-ink);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.top .btn-line:hover{background:rgb(255 255 255 / .1)}

/* 하단 탭바 */
.top .icon-btn{width:34px;height:34px;padding:0;display:grid;place-items:center}
.top .icon-btn .ico{width:18px;height:18px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.sw-btn i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px rgb(255 255 255 / .25)}
.sw-btn.on{border-color:var(--ink)}
.setup{max-width:560px;margin:40px auto;text-align:left}
.setup h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:10px}
.setup p{color:var(--muted);line-height:1.7}
.setup code{font-family:var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:5px;font-size:13px}
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .me .nick{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--board)}
  .tabbar svg{width:22px;height:22px}
}
@media (max-width:860px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar a.on{color:var(--chalk)}}
@media (max-width:860px){:root[data-theme="dark"] .tabbar a.on{color:var(--chalk)}}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 본문 */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 110px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:30px}
.head p{color:var(--muted);font-size:14px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.panel-h h2{font-size:15.5px;font-weight:700}
.panel-b{padding:0 16px 16px}
.more{font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px}
.more:hover{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--board);color:var(--board-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}

.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;
  background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px dashed var(--muted);color:var(--muted);white-space:nowrap}
.dd{font-family:var(--f-mono);font-weight:600;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.dd.soon{background:var(--chalk);color:var(--chalk-ink)}
.dd.today{background:var(--danger);color:#fff}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fchip[style]{color:hsl(var(--h) 60% var(--chip-fg-l))}
.fchip[style].on{background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border-color:hsl(var(--h) 50% var(--chip-mid-l))}
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.toolbar-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* 홈 */
.home{display:flex;flex-direction:column;gap:16px}
.home-cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.home-col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.home-cols{display:flex;flex-direction:column;align-items:stretch}.home-col{display:contents}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}}
.mealnav{display:flex;align-items:center;gap:4px}
.mealnav span{font-size:13px;font-weight:600;color:var(--muted);min-width:64px;text-align:center}
.mealnav button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.mealnav button:hover{background:var(--sunk)}
.mealnav .ico{width:15px;height:15px}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mealbox{background:var(--sunk);border-radius:10px;padding:12px 14px;min-width:0}
.mealbox .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mealbox .mt b{font-size:14px}
.mealbox .mt span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dishes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.5}
.dishes li:first-child{font-weight:700}
.mealmsg{color:var(--muted);font-size:14px;padding:6px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid .thumb{border-radius:8px}
.album{display:flex;flex-direction:column;gap:14px}
.album .panel-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.album .atts{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.hero{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border:0}
.hero .date{font-family:var(--f-display);font-size:44px;line-height:1}
.hero .date small{display:block;font-family:var(--f-body);font-size:14px;opacity:.8;margin-top:6px}
.next{background:rgb(255 255 255 / .1);border-radius:10px;padding:14px 16px;min-width:0;border:0;color:inherit;text-align:left;width:100%}
.next:hover{background:rgb(255 255 255 / .15)}
.next .lbl{font-size:12px;letter-spacing:.06em;opacity:.75;font-weight:600}
.next .t{font-size:19px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.next .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:14px}.hero .date{font-size:36px}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;min-width:0}
.row:first-child{border-top:0}
.row:hover .row-t{text-decoration:underline}
.row-t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{color:var(--muted);font-size:13px;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border-radius:10px;padding:8px 4px;text-align:center;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.wd .n{font-family:var(--f-mono);font-weight:600;font-size:16px}
.wd .w{font-size:12px;color:var(--muted)}
.wd.is-today{background:var(--board);color:var(--board-ink)}
.wd.is-today .w{color:inherit;opacity:.8}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 60% var(--chip-mid-l))}
.dot.ev{background:var(--muted)}

/* 수행평가 카드 */
.alist{display:flex;flex-direction:column;gap:10px}
.month{font-size:13px;font-weight:700;color:var(--muted);margin:10px 2px 0;letter-spacing:.02em}
.acard{display:grid;grid-template-columns:76px 1fr;gap:0;overflow:hidden;text-align:left;padding:0;width:100%;color:inherit}
.acard:hover{border-color:hsl(var(--h) 45% var(--chip-mid-l))}
.adate{background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;gap:2px}
.adate .md{font-family:var(--f-mono);font-weight:600;font-size:18px}
.adate .wk{font-size:12px;font-weight:600}
.abody{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.abody .tline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.abody h3{font-size:16.5px;font-weight:700;overflow-wrap:anywhere}
.abody .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.abody .foot{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.crit{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:7px 9px;font-size:13px}
.crit .cl{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.02em}
.crit .ci{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap}
.crit .ci em{font-style:normal;font-family:var(--f-mono);font-weight:600;color:var(--board);margin-left:4px}
.crit .tot{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--ink)}
.crit .ct{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.duo{grid-template-columns:1fr}}
.dbox{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dbox h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.dbox h4 i{width:8px;height:8px;border-radius:50%;background:var(--board)}
.dbox.cr{background:var(--sunk);border-color:transparent}
.dbox.cr h4 i{background:var(--chalk)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ctable td:last-child{text-align:right;font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.ctable tr.total td{border-bottom:0;font-weight:700;padding-top:9px}
.none{color:var(--muted);font-size:13.5px}
.fhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-block:12px 0}
.fhead i{width:8px;height:8px;border-radius:50%;background:var(--board)}
.fhead.cr i{background:var(--chalk)}
.acard.makeup{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--sunk) 10px 20px);border-style:dashed}
.acard.makeup .adate{background:transparent;border-right:1px dashed hsl(var(--h) 40% var(--chip-mid-l))}
.acard.past{opacity:.72}
.acard.past:hover{opacity:1}

/* 필기 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ncard{text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;color:inherit}
.ncard .cover{aspect-ratio:16/10;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.ncard .cover img{width:100%;height:100%;object-fit:cover}
.ncard .cover .pdf{font-family:var(--f-mono);font-weight:600;font-size:22px;color:hsl(var(--h) 55% var(--chip-mid-l))}
.ncard .nb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ncard h3{font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.ncard .meta{font-size:12.5px;color:var(--muted)}
.ncard:hover h3{text-decoration:underline}
.search{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-width:0;width:220px;max-width:100%}

/* 캘린더 */
.cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media (max-width:980px){.cal-wrap{grid-template-columns:1fr}}
.cal-h{display:flex;align-items:center;gap:8px;padding:14px 16px}
.cal-h h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin-right:auto}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{background:var(--sunk)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal .dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal .dow:first-child,.cell:nth-child(7n+1) .cn{color:var(--danger)}

    if(error){
      const m=error.message||"";
      if(/already|registered|exists/i.test(m)) throw new Error("이미 있는 아이디예요. 다른 아이디를 써 주세요.");
      if(/database error/i.test(m)) throw new Error("가입 코드가 맞지 않아요. 담당 친구에게 코드를 다시 확인해 주세요.");
      if(/password/i.test(m)) throw new Error("비밀번호는 6자 이상으로 해 주세요.");
      throw new Error("가입하지 못했어요: "+m);
    }
    if(!data.session) throw new Error("가입은 됐는데 바로 로그인되지 않았어요. 관리자가 Supabase에서 'Confirm email'을 꺼야 해요.");
    await this.loadProfile(data.user);
  },
  async signIn({username,password}){
    const {data,error} = await this.sb.auth.signInWithPassword({email:this.email(username),password});
    if(error) throw new Error("아이디나 비밀번호가 맞지 않아요.");
    await this.loadProfile(data.user);
  },
  async signOut(){ await this.sb.auth.signOut(); this.user=null; },
  async list(t){
    let q=this.sb.from(t).select("*, author:profiles(nickname)");
    if(t==="messages") q=q.order("created_at",{ascending:false}).limit(150);
    const {data,error}=await q;
    if(error) throw error;
    return sortRows(t,(data||[]).map(r=>({...r,author_nick:r.author?.nickname||"알 수 없음"})));
  },
  async insert(t,row){
    const {error}=await this.sb.from(t).insert({...row,author_id:this.user.id});
    if(error) throw new Error("저장하지 못했어요: "+error.message);
  },
  async remove(t,row){
    const paths=[...(row.attachments||[]),...(row.criteria_attachments||[])].map(a=>a.path).filter(Boolean);
    if(paths.length) await this.sb.storage.from("uploads").remove(paths);
    const {error}=await this.sb.from(t).delete().eq("id",row.id);
    if(error) throw new Error("삭제하지 못했어요: "+error.message);
  },
  async upload(file){
    if(file.size>CONFIG.MAX_FILE_MB*1048576) throw new Error(`${CONFIG.MAX_FILE_MB}MB보다 큰 파일은 올릴 수 없어요: ${file.name}`);
    const ext=((file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,""))||"bin";
    const path=`${this.user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await this.sb.storage.from("uploads").upload(path,file,{contentType:file.type||undefined});
    if(error) throw new Error("파일을 올리지 못했어요: "+error.message);
    const {data}=this.sb.storage.from("uploads").getPublicUrl(path);
    return {name:file.name,url:data.publicUrl,type:file.type,size:file.size,path};
  },
  subscribe(cb){
    this.sb.channel("class-live").on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>cb("messages")).subscribe();
  }
};

function sortRows(t,rows){
  const by=(k,dir=1)=>rows.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*dir);
  if(t==="assessments") return by("due_date");
  if(t==="events") return by("date");
  if(t==="links") return by("created_at");
  if(t==="messages") return by("created_at");
  return by("created_at",-1);
}

/* ---------- 급식 (나이스 공개 API) ---------- */
const Meal={
  cache:{},
  async neis(path,params){
    const u=new URL("https://open.neis.go.kr/hub/"+path);
    const q={Type:"json",pIndex:1,pSize:10,...params}; if(CONFIG.NEIS_KEY) q.KEY=CONFIG.NEIS_KEY;
    for(const [k,v] of Object.entries(q)) u.searchParams.set(k,v);
    const r=await fetch(u); if(!r.ok) throw new Error("급식 정보를 불러오지 못했어요.");
    return r.json();
  },
  async codes(){
    if(CONFIG.NEIS_OFFICE_CODE&&CONFIG.NEIS_SCHOOL_CODE) return {o:CONFIG.NEIS_OFFICE_CODE,s:CONFIG.NEIS_SCHOOL_CODE};
    const key="class13-school:"+CONFIG.SCHOOL_NAME;
    try{ const c=JSON.parse(localStorage.getItem(key)); if(c) return c; }catch(e){}
    const j=await this.neis("schoolInfo",{SCHUL_NM:CONFIG.SCHOOL_NAME});
    const rows=j.schoolInfo?.[1]?.row||[];
    if(!rows.length) throw new Error("학교를 찾지 못했어요. 설정의 학교 이름을 확인해 주세요.");
    const r=rows.find(x=>x.SCHUL_NM===CONFIG.SCHOOL_NAME)||rows[0];
    const c={o:r.ATPT_OFCDC_SC_CODE,s:r.SD_SCHUL_CODE};
    try{ localStorage.setItem(key,JSON.stringify(c)); }catch(e){}
    return c;
  },
  clean(d){ return d.replace(/\([\d.\s,]*\)/g,"").replace(/\([a-zA-Z]{1,3}\)/g,"").replace(/[*#]+/g,"").replace(/\s*[\d.]+\.?\s*$/,"").replace(/\s*\+\s*/g," + ").trim(); },
  async get(date){
    if(this.cache[date]) return this.cache[date];
    const c=await this.codes();
    const j=await this.neis("mealServiceDietInfo",{ATPT_OFCDC_SC_CODE:c.o,SD_SCHUL_CODE:c.s,MLSV_YMD:date.replace(/-/g,"")});
    const rows=(j.mealServiceDietInfo?.[1]?.row||[]).map(r=>({
      type:r.MMEAL_SC_NM||"급식",
      cal:r.CAL_INFO||"",
      dishes:String(r.DDISH_NM||"").split(/<br\s*\/?>/i).map(x=>this.clean(x)).filter(Boolean)
    }));
    return (this.cache[date]=rows);
  }
};
let mealToken=0;
async function loadMeal(date){
  if(!CONFIG.SCHOOL_NAME&&!(CONFIG.NEIS_OFFICE_CODE&&CONFIG.NEIS_SCHOOL_CODE)) return;
  const tk=++mealToken;
  S.meal={date,rows:null,err:null,loading:true}; if(S.view==="home") render();
  try{ const rows=await Meal.get(date); if(tk!==mealToken) return; S.meal={date,rows,err:null,loading:false}; }
  catch(e){ if(tk!==mealToken) return; S.meal={date,rows:null,err:e.message||"급식 정보를 불러오지 못했어요.",loading:false}; }
  if(S.view==="home") render();
}

/* 평가 기준 글을 '항목 점수' 목록으로 읽기 */
function parseCriteria(txt){
  if(!txt) return {items:[],total:0,allPts:false};
  const items=txt.split(/\n|\/|\|/).map(x=>x.trim().replace(/^[-•·*\d]+[.)]?\s+/,"")).filter(Boolean).map(x=>{
    const m=x.match(/^(.*?)[\s:：\-–(]*(\d+(?:\.\d+)?)\s*점?\)?$/);
    return (m&&m[1].trim())?{name:m[1].trim(),pt:+m[2]}:{name:x,pt:null};
  });
  const allPts=items.length>0&&items.every(i=>i.pt!==null);
  return {items,allPts,total:allPts?items.reduce((a,i)=>a+i.pt,0):0};
}
function critStrip(a){
  const c=parseCriteria(a.criteria), n=(a.criteria_attachments||[]).length;
  if(!c.items.length&&!n) return "";
  let inner;
  if(c.allPts) inner=c.items.slice(0,5).map(i=>`<span class="ci">${esc(i.name)}<em>${i.pt}</em></span>`).join("")+(c.items.length>5?`<span class="ci">+${c.items.length-5}</span>`:"")+`<span class="tot">총 ${c.total}점</span>`;
  else if(c.items.length) inner=`<span class="ct">${esc(c.items.join?c.items.map(i=>i.name).join(" · "):"")}</span>`;
  else inner=`<span class="ct">채점 기준표 사진 ${n}장</span>`;
  if(c.items.length&&n) inner+=`<span class="ci">기준표 ${n}</span>`;
  return `<div class="crit"><span class="cl">평가 기준</span>${inner}</div>`;
}
function critDetail(r){
  const c=parseCriteria(r.criteria);
  let html="";
  if(c.allPts) html=`<table class="ctable"><tbody>${c.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.pt}점</td></tr>`).join("")}<tr class="total"><td>합계</td><td>${c.total}점</td></tr></tbody></table>`;
  else if(r.criteria) html=`<div class="prose">${linkify(r.criteria)}</div>`;
  html+=attHTML(r.criteria_attachments,"기준표");
  return html||`<p class="none">아직 평가 기준이 없어요.</p>`;
}

const ACCENTS=[["green","칠판","#1D5A4D"],["ocean","바다","#1F4E8C"],["sunset","노을","#A9432A"],["grape","포도","#5B3F8C"],["ink","먹","#2B3035"]];
function themePref(){ try{ return JSON.parse(localStorage.getItem("class13-theme"))||{}; }catch(e){ return {}; } }
function applyTheme(p=themePref()){
  const r=document.documentElement;
  if(p.mode==="light"||p.mode==="dark") r.dataset.theme=p.mode; else delete r.dataset.theme;
  if(p.accent&&p.accent!=="green") r.dataset.accent=p.accent; else delete r.dataset.accent;
}
function setTheme(k,v){ const p=themePref(); p[k]=v; try{ localStorage.setItem("class13-theme",JSON.stringify(p)); }catch(e){} applyTheme(p); openTheme(); }
function openTheme(){
  const p=themePref(), mode=p.mode||"system", acc=p.accent||"green";
  openModal(`<div class="modal-h"><h2>테마</h2><button class="close" data-act="close" aria-label="닫기">×</button></div>
  <div class="modal-b">
    <div class="fld"><span class="lb">화면 밝기</span>
      <div class="seg" style="align-self:flex-start">${[["system","기기 설정"],["light","라이트"],["dark","다크"]].map(([k,v])=>`<button class="${mode===k?"on":""}" data-act="setTheme" data-k="mode" data-v="${k}">${v}</button>`).join("")}</div></div>
    <div class="fld"><span class="lb">색 테마</span>
      <div class="swatches">${ACCENTS.map(([k,n,c])=>`<button class="sw-btn ${acc===k?"on":""}" data-act="setTheme" data-k="accent" data-v="${k}" aria-pressed="${acc===k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div></div>
    <p class="row-m" style="white-space:normal">테마는 지금 쓰는 기기에만 저장돼요.</p>

}

function openModal(html,cls=""){
  $("#modalRoot").innerHTML=`<div class="scrim" data-act="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow="hidden";
  const f=$("#modalRoot input:not([type=hidden]), #modalRoot textarea"); if(f && matchMedia("(min-width:700px)").matches) f.focus();
}
function closeModal(){ $("#modalRoot").innerHTML=""; document.body.style.overflow=""; pending={}; }

function attHTML(atts,label="첨부"){

  const imgs=atts.filter(isImg), files=atts.filter(a=>!isImg(a));
  return `<div class="sec"><h4>${esc(label)} ${atts.length}개</h4>
    ${imgs.length?`<div class="atts">${imgs.map(a=>`<button class="thumb" data-act="lightbox" data-src="${esc(a.url)}" data-name="${esc(a.name)}"><img src="${esc(a.url)}" alt="${esc(a.name)}" loading="lazy"></button>`).join("")}</div>`:""}
    ${files.length?`<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${files.map(a=>`<div class="filerow"><span class="fi">${esc((a.name.split(".").pop()||"FILE").toUpperCase().slice(0,4))}</span><span class="fn">${esc(a.name)}</span>${a.url.startsWith("http")?`<button class="btn ghost sm" data-act="pdf" data-src="${esc(a.url)}" data-name="${esc(a.name)}">미리보기</button><a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">새 탭</a>`:`<a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">열기</a>`}</div>`).join("")}</div>`:""}

}

/* 삭제: 한 번 더 눌러야 지워져요 */
async function doDelete(btn){
  const t=btn.dataset.t, id=btn.dataset.id;
  if(btn.dataset.armed!=="1"){ btn.dataset.armed="1"; btn.textContent="한 번 더 누르면 삭제"; btn.classList.add("danger"); setTimeout(()=>{ if(btn.isConnected){btn.dataset.armed="";btn.textContent=btn.classList.contains("x")?"×":"삭제";} },3500); return; }
  const r=S.data[t].find(x=>x.id===id); if(!r) return;
  btn.disabled=true;
  try{ await api.remove(t,r); await reload(t); closeModal(); render(); toast("삭제했어요"); }
  catch(e){ btn.disabled=false; toast(e.message||"삭제하지 못했어요"); }
}

    ["taken_date","찍은 날","date",{def:"today"}],
    ["attachments","사진","files",{img:1}]]},
  posts:{table:"posts",title:"글쓰기",fields:[
    ["title","제목","text",{req:1}],["body","내용","area"],["attachments","사진 · 파일","files"]]}
};
let pending={};

function fieldHTML([name,label,kind,o={}],pre={}){
  const id="f_"+name, req=o.req?' <span class="req">*</span>':"";
  const val=pre[name] ?? (o.def==="today"?today():"");
  if(kind==="head") return `<div class="fhead ${o.cr?"cr":""}"><i></i>${esc(label)}</div>`;
  if(kind==="check") return `<label class="check" for="${id}"><input type="checkbox" id="${id}" name="${name}">${esc(label)}</label>`;
  if(kind==="files") return `<div class="fld"><span class="lb">${esc(label)}</span>
    <div class="drop" id="drop_${name}" data-f="${name}" data-img="${o.img?1:""}">파일을 여기로 끌어오거나 <label for="${id}">파일 고르기</label><br><small>${o.img?"사진만":"사진 · PDF"}, 파일당 ${CONFIG.MAX_FILE_MB}MB까지</small>
    <input type="file" id="${id}" name="${name}" accept="${o.img?"image/*":"image/*,application/pdf"}" multiple hidden></div><div class="flist" id="flist_${name}"></div></div>`;
  let input;
  if(kind==="subject") input=`<select id="${id}" name="${name}">${SUBJECTS.map(s=>`<option ${pre.subject===s[0]?"selected":""}>${s[0]}</option>`).join("")}</select>`;
  else if(kind==="select") input=`<select id="${id}" name="${name}">${o.opts.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`;
  else if(kind==="area") input=`<textarea id="${id}" name="${name}" placeholder="${esc(o.ph||"")}">${esc(val)}</textarea>`;
  else input=`<input type="${kind==="url"?"url":kind}" id="${id}" name="${name}" value="${esc(val)}" placeholder="${esc(o.ph||"")}" ${kind==="url"?'inputmode="url"':""}>`;
  return `<div class="fld"><label for="${id}">${esc(label)}${req}</label>${input}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:""}</div>`;
}
function openCompose(type,pre={}){
  if(!me()){ openAuth("login","글을 올리려면 먼저 로그인해 주세요."); return; }
  const spec=FORMS[type]; pending={};
  if(S.view==="perf"&&S.perfSub!=="전체") pre.subject??=S.perfSub;
  if(S.view==="notes"&&S.noteSub!=="전체") pre.subject??=S.noteSub;
  const fs=spec.fields; let html="";
  for(let i=0;i<fs.length;i++){
    if(fs[i][3]?.half && fs[i+1]?.[3]?.half){ html+=`<div class="two">${fieldHTML(fs[i],pre)}${fieldHTML(fs[i+1],pre)}</div>`; i++; }
    else html+=fieldHTML(fs[i],pre);
  }
  openModal(`<div class="modal-h"><h2>${esc(spec.title)}</h2><button class="close" data-act="close" aria-label="닫기">×</button></div>
    <div class="modal-b"><form class="form" id="composeForm" data-type="${type}" novalidate>${html}<div id="formErr"></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn" id="submitBtn">올리기</button></div></form></div>`);
  for(const [name,,kind] of spec.fields){
    if(kind!=="files") continue;
    pending[name]=[];
    const fi=$("#f_"+name), dz=$("#drop_"+name);
    fi.addEventListener("change",()=>{ addFiles(name,fi.files); fi.value=""; });
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");addFiles(name,e.dataTransfer.files);});
  }
}
function addFiles(name,list){
  const arr=pending[name]||(pending[name]=[]);
  const imgOnly=$("#drop_"+name)?.dataset.img==="1";
  for(const f of list){
    if(imgOnly ? !/^image\//.test(f.type) : !/^image\/|^application\/pdf$/.test(f.type)){ toast(`${imgOnly?"사진만":"사진과 PDF만"} 올릴 수 있어요: ${f.name}`); continue; }
    arr.push(f);
  }
  $("#flist_"+name).innerHTML=arr.map((f,i)=>`<div class="fitem"><span>${esc(f.name)}</span><small>${sizeTxt(f.size)}</small><button type="button" data-act="unfile" data-f="${name}" data-i="${i}" aria-label="빼기">×</button></div>`).join("");
}
async function submitCompose(form){
  const type=form.dataset.type, spec=FORMS[type], row={...(spec.fixed||{})};
  const err=m=>{ $("#formErr").innerHTML=`<div class="err">${esc(m)}</div>`; };
  for(const [name,label,kind,o={}] of spec.fields){
    if(kind==="files"||kind==="head") continue;
    const el=form.elements[name];
    const v=kind==="check"?el.checked:el.value.trim();
    if(o.req && !v) return err(`‘${label}’ 칸을 채워 주세요.`);
    row[name]= v===""?null:v;
  }
  if(row.url && !/^https?:\/\//i.test(row.url)) row.url="https://"+row.url;
  const btn=$("#submitBtn"); btn.disabled=true;
  try{
    const fileFields=spec.fields.filter(f=>f[2]==="files").map(f=>f[0]);
    if(type==="photos"&&!(pending.attachments||[]).length){ btn.disabled=false; return err("사진을 한 장 이상 골라 주세요."); }
    const total=fileFields.reduce((a,n)=>a+(pending[n]||[]).length,0); let done=0;
    for(const n of fileFields){
      row[n]=[];
      for(const f of (pending[n]||[])){ done++; btn.textContent=`파일 올리는 중 ${done}/${total}`; row[n].push(await api.upload(f)); }
    }
    btn.textContent="저장 중…";
    await api.insert(spec.table,row);
    await reload(spec.table); closeModal(); render(); toast("올렸어요");
  }catch(e){ btn.disabled=false; btn.textContent="올리기"; err(e.message||"올리지 못했어요. 다시 해 주세요."); }
}

/* ---------- 로그인 / 회원가입 ---------- */
function openAuth(tab="login",note=""){
  const L=tab==="login";
  openModal(`<div class="modal-h"><h2>${L?"로그인":"회원가입"}</h2><button class="close" data-act="close" aria-label="닫기">×</button></div>
  <div class="modal-b">
    <div class="authtabs"><button class="${L?"on":""}" data-act="authTab" data-v="login">로그인</button><button class="${L?"":"on"}" data-act="authTab" data-v="signup">회원가입</button></div>
    ${note?`<p class="row-m" style="white-space:normal">${esc(note)}</p>`:""}
    <form class="form" id="authForm" data-tab="${tab}" novalidate>
      <div class="fld"><label for="a_user">아이디</label><input type="text" id="a_user" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문 소문자 · 숫자 3~20자"></div>
      <div class="fld"><label for="a_pw">비밀번호</label><input type="password" id="a_pw" autocomplete="${L?"current-password":"new-password"}" placeholder="6자 이상"></div>
      ${L?"":`<div class="fld"><label for="a_nick">이름(닉네임)</label><input type="text" id="a_nick" maxlength="12" placeholder="반 친구들에게 보일 이름"></div>
      <div class="fld"><label for="a_code">반 가입 코드</label><input type="text" id="a_code" autocomplete="off" placeholder="담당 친구에게 받은 코드"><span class="hint">우리 반 친구만 가입할 수 있게 코드를 받아요.</span></div>`}
      <div id="authErr"></div>
      <button class="btn" id="authBtn">${L?"로그인":"가입하고 시작하기"}</button>
      ${L?`<p class="row-m" style="white-space:normal;text-align:center">비밀번호를 잊었다면 사이트 관리자에게 말해 주세요.</p>`:""}
    </form></div>`,"sm");
}
async function submitAuth(form){
  const L=form.dataset.tab==="login";
  const username=$("#a_user").value.trim().toLowerCase(), password=$("#a_pw").value;
  const err=m=>{ $("#authErr").innerHTML=`<div class="err">${esc(m)}</div>`; };
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return err("아이디는 영문 소문자, 숫자, _ 로 3~20자예요.");
  if(password.length<6) return err("비밀번호는 6자 이상이에요.");
  const btn=$("#authBtn"); btn.disabled=true;
  try{
    if(L) await api.signIn({username,password});
    else{
      const nickname=$("#a_nick").value.trim(), joinCode=$("#a_code").value.trim();
      if(!nickname){ btn.disabled=false; return err("이름(닉네임)을 적어 주세요."); }
      if(!joinCode){ btn.disabled=false; return err("반 가입 코드를 적어 주세요."); }
      await api.signUp({username,password,nickname,joinCode});
    }
    closeModal(); await afterAuth(); toast(`${me()?.nickname||""} 님, 반가워요`);
  }catch(e){ btn.disabled=false; err(e.message); }
}
async function afterAuth(){ await Promise.all(LOGIN_ONLY.map(t=>reload(t))); render(); }

/* ======================================================================
   이벤트
   ====================================================================== */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="scrim"){ if(e.target===el) closeModal(); return; }
  if(el.tagName==="A" && a!=="nav") return;
  e.preventDefault();
  switch(a){
    case "nav": go(el.dataset.view); break;
    case "login": openAuth("login"); break;
    case "theme": openTheme(); break;
    case "setTheme": setTheme(el.dataset.k, el.dataset.v); break;
    case "authTab": openAuth(el.dataset.v); break;
    case "logout": await api.signOut(); LOGIN_ONLY.forEach(t=>S.data[t]=[]); render(); toast("로그아웃했어요"); break;
    case "close": closeModal(); break;
    case "detail": openDetail(el.dataset.t,el.dataset.id); break;
    case "compose": openCompose(el.dataset.type, el.dataset.date?{date:el.dataset.date}:{}); break;
    case "del": e.stopPropagation(); doDelete(el); break;
    case "unfile": pending[el.dataset.f].splice(+el.dataset.i,1); addFiles(el.dataset.f,[]); break;
    case "perfTab": S.perfTab=el.dataset.v; render(); break;
    case "perfSub": S.perfSub=el.dataset.v; render(); break;
    case "noteSub": S.noteSub=el.dataset.v; render(); break;
    case "lounge": S.lounge=el.dataset.v; if(el.dataset.go) go("lounge"); else render(); break;
    case "mealMove": { let d=addDays(S.meal.date||today(),+el.dataset.v); const w=parseD(d).getDay(); if(w===0||w===6) d=addDays(d,(+el.dataset.v>0)?(w===6?2:1):(w===0?-2:-1)); loadMeal(d); break; }
    case "calMove": { let m=S.cal.m+ +el.dataset.v, y=S.cal.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.cal.m=m; S.cal.y=y; render(); break; }
    case "calToday": { const d=new Date(); S.cal={y:d.getFullYear(),m:d.getMonth(),sel:today()}; render(); break; }
    case "calDay": { const d=parseD(el.dataset.date); S.cal={y:d.getFullYear(),m:d.getMonth(),sel:el.dataset.date}; if(el.dataset.go) go("cal"); else render(); break; }
    case "lightbox": showLightbox(el.dataset.src,el.dataset.name); break;
    case "pdf": showPdf(el.dataset.src,el.dataset.name); break;
    case "lbclose": $("#lb")?.remove(); break;
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="composeForm") submitCompose(e.target);
  if(e.target.id==="authForm") submitAuth(e.target);
  if(e.target.id==="chatForm") sendChat();
});
document.addEventListener("input",e=>{
  if(e.target.id==="noteSearch"){ S.noteQ=e.target.value; $("#noteGrid").innerHTML=noteCards(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#lb")) $("#lb").remove(); else closeModal(); } });

async function sendChat(){
  const inp=$("#chatInput"); const body=inp.value.trim(); if(!body||!me()) return;
  inp.value="";
  try{ await api.insert("messages",{body}); await reload("messages"); const l=$("#chatList"); if(l){ l.innerHTML=chatHTML(); scrollChat(); } }
  catch(e){ inp.value=body; toast(e.message); }
}
function showLightbox(src,name){
  const d=document.createElement("div"); d.className="lightbox"; d.id="lb";
  d.innerHTML=`<button class="close" data-act="lbclose" aria-label="닫기">×</button><img src="${esc(src)}" alt="${esc(name)}"><div class="cap">${esc(name)}${src.startsWith("http")?` · <a href="${esc(src)}" target="_blank" rel="noopener" style="color:#fff">원본 크게 보기</a>`:""}</div>`;
  d.addEventListener("click",ev=>{ if(ev.target===d) d.remove(); });
  document.body.appendChild(d);
}
function showPdf(src,name){
  const d=document.createElement("div"); d.className="lightbox"; d.id="lb";
  d.innerHTML=`<button class="close" data-act="lbclose" aria-label="닫기">×</button><iframe class="pdfframe" src="${esc(src)}" title="${esc(name)}" style="height:78vh;max-width:960px;background:#fff"></iframe><div class="cap">${esc(name)} · 화면에 안 보이면 <a href="${esc(src)}" target="_blank" rel="noopener" style="color:#fff">새 탭에서 열기</a></div>`;
  document.body.appendChild(d);
}

function go(v){
  if(!VIEWS[v]) v="home";
  S.view=v;
  if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  render(); window.scrollTo({top:0});
}
window.addEventListener("hashchange",()=>{ const v=location.hash.slice(1); if(v&&v!==S.view&&VIEWS[v]) go(v); });

/* ---------- 시작 ---------- */

  document.title=CONFIG.SITE_NAME+" 사이트";

    return;
  }
  try{

    Live.onAuth=()=>afterAuth();
    await loadAll();

    return;

  S.ready=true; render();
  { let d=today(); const w=parseD(d).getDay(); loadMeal(d); }

</script>
