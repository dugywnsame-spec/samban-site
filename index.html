<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>1-3 우리반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 칠판색 상단 띠 + 넓은 화면은 상단 메뉴, 좁은 화면은 하단 탭바. 본문은 카드형 패널 그리드 */
:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --sunk:#EBF0EC; --ink:#1B2421; --muted:#5B6863; --line:#DCE3DE;
  --board:#1D5A4D; --board-ink:#FFFFFF; --chalk:#F2C64B; --chalk-ink:#3A2B00;
  --danger:#B83A26; --danger-bg:#FBE9E5;
  --chip-s:68%; --chip-bg-l:91%; --chip-fg-l:29%; --chip-mid-l:46%;
  --shadow:0 1px 2px rgb(22 36 30 / .05), 0 6px 18px rgb(22 36 30 / .06);
  --scrim:rgb(14 22 19 / .55);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111715; --surface:#19211E; --sunk:#141B18; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --board:#1F4F44; --board-ink:#F2F6F4; --chalk:#E8BE45; --chalk-ink:#2E2300;
  --danger:#EE7A64; --danger-bg:#3A1F1A;
  --chip-s:42%; --chip-bg-l:23%; --chip-fg-l:82%; --chip-mid-l:62%;
  --shadow:none; --scrim:rgb(0 0 0 / .65); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111715; --surface:#19211E; --sunk:#141B18; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --board:#1F4F44; --board-ink:#F2F6F4; --chalk:#E8BE45; --chalk-ink:#2E2300;
  --danger:#EE7A64; --danger-bg:#3A1F1A;
  --chip-s:42%; --chip-bg-l:23%; --chip-fg-l:82%; --chip-mid-l:62%;
  --shadow:none; --scrim:rgb(0 0 0 / .65); color-scheme:dark;}

/* 색 테마: 상단 띠·버튼 색만 바뀜 */
:root[data-accent="ocean"]{--board:#1F4E8C}
:root[data-accent="sunset"]{--board:#A9432A}
:root[data-accent="grape"]{--board:#5B3F8C}
:root[data-accent="ink"]{--board:#2B3035}
@media (prefers-color-scheme: dark){
  :root[data-accent="ocean"]:not([data-theme="light"]){--board:#244A75}
  :root[data-accent="sunset"]:not([data-theme="light"]){--board:#7E3524}
  :root[data-accent="grape"]:not([data-theme="light"]){--board:#46336A}
  :root[data-accent="ink"]:not([data-theme="light"]){--board:#353C42}}
:root[data-accent="ocean"][data-theme="dark"]{--board:#244A75}
:root[data-accent="sunset"][data-theme="dark"]{--board:#7E3524}
:root[data-accent="grape"][data-theme="dark"]{--board:#46336A}
:root[data-accent="ink"][data-theme="dark"]{--board:#353C42}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--board)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:var(--board)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prose a{color:var(--chalk)}}
:root[data-theme="dark"] .prose a{color:var(--chalk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--board);color:var(--board-ink)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:23px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--chalk);color:var(--chalk-ink);font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 8px;border-radius:6px;flex:none}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{color:inherit;opacity:.75;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14.5px;white-space:nowrap}
.nav a:hover{opacity:1}
.nav a.on{opacity:1;background:rgb(255 255 255 / .12);box-shadow:inset 0 -2px 0 var(--chalk)}
.auth{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.top .btn-line{background:transparent;border:1px solid rgb(255 255 255 / .35);color:var(--board-ink);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.top .btn-line:hover{background:rgb(255 255 255 / .1)}

/* 하단 탭바 */
.top .icon-btn{width:34px;height:34px;padding:0;display:grid;place-items:center}
.top .icon-btn .ico{width:18px;height:18px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.sw-btn i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px rgb(255 255 255 / .25)}
.sw-btn.on{border-color:var(--ink)}
.setup{max-width:560px;margin:40px auto;text-align:left}
.setup h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:10px}
.setup p{color:var(--muted);line-height:1.7}
.setup code{font-family:var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:5px;font-size:13px}
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .me .nick{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--board)}
  .tabbar svg{width:22px;height:22px}
}
@media (max-width:860px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar a.on{color:var(--chalk)}}
@media (max-width:860px){:root[data-theme="dark"] .tabbar a.on{color:var(--chalk)}}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 본문 */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 110px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:30px}
.head p{color:var(--muted);font-size:14px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
.panel-h h2{font-size:15.5px;font-weight:700}
.panel-b{padding:0 16px 16px}
.more{font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px}
.more:hover{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--board);color:var(--board-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}

.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;
  background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px dashed var(--muted);color:var(--muted);white-space:nowrap}
.dd{font-family:var(--f-mono);font-weight:600;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.dd.soon{background:var(--chalk);color:var(--chalk-ink)}
.dd.today{background:var(--danger);color:#fff}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fchip[style]{color:hsl(var(--h) 60% var(--chip-fg-l))}
.fchip[style].on{background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border-color:hsl(var(--h) 50% var(--chip-mid-l))}
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.toolbar-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* 홈 */
.home{display:flex;flex-direction:column;gap:14px}
.home-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.home-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.home-col{display:flex;flex-direction:column;gap:16px;min-width:0}
/* 태블릿 세로(한눈에 보기): 2열 + 아래 한 줄 */
@media (min-width:681px) and (max-width:959px){
  .home.dense .home-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home.dense .home-col.cc{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
}
@media (max-width:680px){.home-top{display:contents}.home-cols{display:flex;flex-direction:column;align-items:stretch}.home-col{display:contents}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}}
/* 시간표 */
.tt-now{font-size:13px;font-weight:600;color:var(--muted)}
.tt-now b{color:var(--ink)}
.ttrow{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:5px}
.ttc{border-radius:9px;padding:8px 2px 7px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.ttc .p{font-family:var(--f-mono);font-size:11px;font-weight:600;opacity:.8}
.ttc .sj{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttc.past{opacity:.42}
.ttc.now{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--chalk)}
.ttc.blank{background:var(--sunk);color:var(--muted)}
button.ttc{border:0;font:inherit;cursor:pointer;position:relative}
.ttc .mk,.ttable .mk{display:block;font-size:10.5px;font-weight:800;line-height:1.2;background:var(--danger);color:#fff;border-radius:4px;padding:1px 3px;margin:2px auto 0;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ttc .mk.re,.ttable .mk.re{background:var(--surface);color:var(--muted);border:1px dashed var(--muted)}
.tt-today{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.tt-today .row{padding:6px 0}
.ttable-wrap{overflow-x:auto}
.ttable{width:100%;border-collapse:separate;border-spacing:5px;min-width:340px;table-layout:fixed}
.ttable th{font-size:13px;color:var(--muted);font-weight:700;padding:4px 0}
.ttable th.today{color:var(--ink)}
.ttable th.today span{background:var(--board);color:var(--board-ink);border-radius:6px;padding:2px 8px}
.ttable td.pc{font-size:12px;color:var(--muted);text-align:center;width:68px;line-height:1.3}
.ttable td.pc b{display:block;font-size:13px;color:var(--ink)}
.ttable td.sc{border-radius:9px;text-align:center;font-weight:700;font-size:14.5px;height:52px;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.ttable td.sc.blank{background:var(--sunk)}
.ttable td.sc.now{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--chalk)}
.ttable td.sc button{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:46px;cursor:pointer}
.ttable td.sc button:focus-visible{outline:2px solid var(--chalk)}
.ttable td.sc.has{box-shadow:inset 0 0 0 2px var(--danger)}
.ttable td.sc.chg{outline:2px dashed var(--chalk-ink);outline-offset:-4px}
.ttc.chg{outline:2px dashed var(--chalk-ink);outline-offset:-3px}
.mk.cg{background:var(--chalk);color:var(--chalk-ink)}
.ttable td.sc .was{display:block;font-size:10px;font-weight:600;opacity:.7;text-decoration:line-through}
.tttools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ttedit{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.ttedit th{font-size:12.5px;color:var(--muted);font-weight:700}
.ttedit td.pc{font-size:12px;color:var(--muted);text-align:center;width:44px}
.ttedit input{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 4px;text-align:center;font-size:13.5px;font-weight:600}
.ttable td.sc.has.now{box-shadow:inset 0 0 0 2px var(--danger),0 0 0 2px var(--surface),0 0 0 4px var(--chalk)}
.ttable th small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;margin-top:2px}
.ttweek{display:flex;align-items:center;gap:6px}
.ttweek span{font-family:var(--f-mono);font-size:13px;font-weight:600;min-width:104px;text-align:center}
.ttlist{display:flex;flex-direction:column;margin-top:10px}
.ttable tr.lunch td{height:auto;background:none;font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
@media (max-width:560px){.ttable{min-width:0;border-spacing:3px}.ttable td.pc{width:34px}.ttable td.pc .tm{display:none}.ttable td.pc b{font-size:11.5px}.ttable td.sc{font-size:12px;height:46px}.ttable .mk{font-size:9.5px}.ttc .sj{font-size:12px}}
/* 좋아요 · 댓글 */
.stat{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.stat .ico{width:13px;height:13px}
.stats{display:inline-flex;gap:10px;flex-wrap:wrap}
.social{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.likebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--ink)}
.likebtn .ico{width:16px;height:16px}
.likebtn.on{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.likebtn.on .ico{fill:currentColor}
.sbar .stat{font-size:13px}
.clist{display:flex;flex-direction:column;gap:12px}
.cm{display:grid;grid-template-columns:30px 1fr;gap:10px;min-width:0}
.cm.reply{margin-left:40px;grid-template-columns:26px 1fr}
.cm .ava{width:30px;height:30px;font-size:12px}
.cm.reply .ava{width:26px;height:26px;font-size:11px}
.cm .cb{min-width:0}
.cm .ch{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.cm .ch b{color:var(--ink);font-size:13.5px}
.cm .ct{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.55;margin-top:2px}
.cm .ct .to{color:var(--board);font-weight:600;margin-right:4px}
.cm .ca{display:flex;gap:12px;margin-top:4px}
.cm .ca button{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.cm .ca button:hover{color:var(--ink)}
.cm .ca button.on{color:var(--danger)}
.cm .ca .ico{width:13px;height:13px}
.cm .ca button.on .ico{fill:currentColor}
.cform{display:flex;flex-direction:column;gap:6px}
.cform .row2{display:flex;gap:8px}
.cform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.replying{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.replying button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12.5px}
.album-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
/* 멤버 */
.mtop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:640px){.mtop{grid-template-columns:1fr}}
.mtopc{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;color:inherit;width:100%}
.mtopc .rk{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--chalk-ink);background:var(--chalk);border-radius:6px;padding:1px 7px}
.mtopc .ava{width:40px;height:40px;font-size:16px}
.mtopc .mt{min-width:0;flex:1}
.mtopc b{display:block;font-size:15px}
.mtopc span.sm{font-size:12.5px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mcard{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:14px;text-align:left;color:inherit;width:100%}
.mcard:hover{border-color:var(--muted)}
.mcard .ava,.mhead .ava{width:44px;height:44px;font-size:17px;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.mtopc .ava{background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) 60% var(--chip-fg-l))}
.mcard .mt{min-width:0}
.mcard b{font-size:15px;display:flex;align-items:center;gap:6px}
.mcard .sm{font-size:12.5px;color:var(--muted);margin-top:2px}
.mhead{display:flex;align-items:center;gap:14px}

const Live = {
  sb:null, user:null, onAuth:null,
  async init(){
    await new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"; s.onload=ok; s.onerror=()=>no(new Error("서버 연결 도구를 불러오지 못했어요.")); document.head.appendChild(s); });
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const {data} = await this.sb.auth.getSession();
    if(data.session) await this.loadProfile(data.session.user);
    this.sb.auth.onAuthStateChange((ev,s)=>{ setTimeout(async()=>{ if(s?.user) await this.loadProfile(s.user); else this.user=null; this.onAuth&&this.onAuth(); },0); });
  },
  async loadProfile(u){
    const {data} = await this.sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
    this.user = data ? {id:u.id,username:data.username,nickname:data.nickname,role:data.role} : null;
  },
  email(u){ return `${u}@${CONFIG.EMAIL_DOMAIN}`; },
  async signUp({username,password,nickname,joinCode}){
    const {data,error} = await this.sb.auth.signUp({email:this.email(username),password,options:{data:{username,nickname,join_code:joinCode}}});
    if(error){
      const m=error.message||"";
      if(/already|registered|exists/i.test(m)) throw new Error("이미 있는 아이디예요. 다른 아이디를 써 주세요.");
      if(/database error/i.test(m)) throw new Error("가입 코드가 맞지 않아요. 담당 친구에게 코드를 다시 확인해 주세요.");
      if(/password/i.test(m)) throw new Error("비밀번호는 6자 이상으로 해 주세요.");
      throw new Error("가입하지 못했어요: "+m);
    }
    if(!data.session) throw new Error("가입은 됐는데 바로 로그인되지 않았어요. 관리자가 Supabase에서 'Confirm email'을 꺼야 해요.");
    await this.loadProfile(data.user);
  },
  async signIn({username,password}){
    const {data,error} = await this.sb.auth.signInWithPassword({email:this.email(username),password});
    if(error) throw new Error("아이디나 비밀번호가 맞지 않아요.");
    await this.loadProfile(data.user);
  },
  async signOut(){ await this.sb.auth.signOut(); this.user=null; },
  async list(t){
    let q=this.sb.from(t).select(NO_AUTHOR.includes(t)?"*":"*, author:profiles(nickname)");
    if(t==="messages") q=q.order("created_at",{ascending:false}).limit(150);
    const {data,error}=await q;
    if(error) throw error;
    return sortRows(t,(data||[]).map(r=>({...r,author_nick:r.author?.nickname||"알 수 없음"})));
  },
  async like(tt,tid,on){
    const q=this.sb.from("likes");
    const {error}= on ? await q.insert({target_table:tt,target_id:tid}) : await q.delete().match({target_table:tt,target_id:tid,user_id:this.user.id});
    if(error) throw new Error("좋아요를 반영하지 못했어요.");
  },
  async view(t,id){ try{ await this.sb.rpc("increment_view",{tbl:t,rid:id}); }catch(e){} },
  async saveTimetable(data){
    const {error}=await this.sb.from("class_timetable").upsert({id:1,data,author_id:this.user.id,updated_at:new Date().toISOString()});
    if(error) throw new Error("시간표를 저장하지 못했어요. 관리자만 바꿀 수 있어요.");
  },
  async update(t,id,row){
    const {error}=await this.sb.from(t).update({...row,edited_at:new Date().toISOString()}).eq("id",id);
    if(error) throw new Error("수정하지 못했어요: "+error.message);
  },
  async insert(t,row){
    const {error}=await this.sb.from(t).insert({...row,author_id:this.user.id});
    if(error) throw new Error("저장하지 못했어요: "+error.message);
  },
  async remove(t,row){
    const paths=[...(row.attachments||[]),...(row.criteria_attachments||[])].map(a=>a.path).filter(Boolean);
    if(paths.length) await this.sb.storage.from("uploads").remove(paths);
    const {error}=await this.sb.from(t).delete().eq("id",row.id);
    if(error) throw new Error("삭제하지 못했어요: "+error.message);
  },
  async upload(file){
    if(file.size>CONFIG.MAX_FILE_MB*1048576) throw new Error(`${CONFIG.MAX_FILE_MB}MB보다 큰 파일은 올릴 수 없어요: ${file.name}`);
    const ext=((file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,""))||"bin";
    const path=`${this.user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await this.sb.storage.from("uploads").upload(path,file,{contentType:file.type||undefined});
    if(error) throw new Error("파일을 올리지 못했어요: "+error.message);
    const {data}=this.sb.storage.from("uploads").getPublicUrl(path);
    return {name:file.name,url:data.publicUrl,type:file.type,size:file.size,path};
  },
  subscribe(cb){
    this.sb.channel("class-live").on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>cb("messages")).subscribe();
  }
};

function sortRows(t,rows){
  if(t==="profiles") return rows.sort((a,b)=>a.created_at<b.created_at?-1:1);
  if(t==="class_roster") return rows.sort((a,b)=>a.no-b.no);
  const by=(k,dir=1)=>rows.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*dir);
  if(t==="assessments") return by("due_date");
  if(t==="events") return by("date");
  if(t==="links") return by("created_at");
  if(t==="homework") return by("due_date");
  if(t==="meal_order") return by("created_at",-1);
  if(t==="messages") return by("created_at");
  return by("created_at",-1);
}

function foldSet(){ try{ return new Set(JSON.parse(localStorage.getItem("class13-folded"))||[]); }catch(e){ return new Set(); } }
function addFolds(){
  const f=foldSet();
  document.querySelectorAll("#main .home section.panel:not(.hero)").forEach(sec=>{
    const k=(sec.className.match(/\bo\d\b/)||[])[0]||(sec.classList.contains("notice")?"notice":sec.classList.contains("quote")?"quote":null); if(!k) return;
    const h=sec.querySelector(".panel-h")||sec.querySelector(".nh"); if(!h) return;
    const open=!f.has(k), title=h.querySelector("h2,b");
    sec.classList.toggle("folded",!open);
    if(title){ title.dataset.act="fold"; title.dataset.k=k; title.classList.add("foldable"); }
    const b=document.createElement("button");
    b.className="fold"; b.dataset.act="fold"; b.dataset.k=k;
    b.setAttribute("aria-expanded",String(open)); b.setAttribute("aria-label",open?"접기":"펼치기"); b.title=open?"접기":"펼치기";
    b.innerHTML=icon("down"); h.appendChild(b);
  });
  const n=f.size, bar=document.querySelector("#main .foldall-btn");
  if(bar) bar.hidden=!n;
}
function toggleFold(k){
  const f=foldSet(); f.has(k)?f.delete(k):f.add(k);
  try{ localStorage.setItem("class13-folded",JSON.stringify([...f])); }catch(e){}
  render();
}

/* ---------- 급식 (나이스 공개 API) ---------- */
const Meal={
  cache:{},
  async neis(path,params){
    const u=new URL("https://open.neis.go.kr/hub/"+path);
    const q={Type:"json",pIndex:1,pSize:10,...params}; if(CONFIG.NEIS_KEY) q.KEY=CONFIG.NEIS_KEY;
    for(const [k,v] of Object.entries(q)) u.searchParams.set(k,v);
    const r=await fetch(u); if(!r.ok) throw new Error("급식 정보를 불러오지 못했어요.");
    return r.json();
  },
  async codes(){
    if(CONFIG.NEIS_OFFICE_CODE&&CONFIG.NEIS_SCHOOL_CODE) return {o:CONFIG.NEIS_OFFICE_CODE,s:CONFIG.NEIS_SCHOOL_CODE};
    const key="class13-school:"+CONFIG.SCHOOL_NAME;
    try{ const c=JSON.parse(localStorage.getItem(key)); if(c) return c; }catch(e){}
    const j=await this.neis("schoolInfo",{SCHUL_NM:CONFIG.SCHOOL_NAME});
    const rows=j.schoolInfo?.[1]?.row||[];
    if(!rows.length) throw new Error("학교를 찾지 못했어요. 설정의 학교 이름을 확인해 주세요.");
    const r=rows.find(x=>x.SCHUL_NM===CONFIG.SCHOOL_NAME)||rows[0];
    const c={o:r.ATPT_OFCDC_SC_CODE,s:r.SD_SCHUL_CODE};
    try{ localStorage.setItem(key,JSON.stringify(c)); }catch(e){}
    return c;
  },
  clean(d){ return d.replace(/\([\d.\s,]*\)/g,"").replace(/\([a-zA-Z]{1,3}\)/g,"").replace(/[*#]+/g,"").replace(/\s*[\d.]+\.?\s*$/,"").replace(/\s*\+\s*/g," + ").trim(); },
  async get(date){
    if(this.cache[date]) return this.cache[date];
    const c=await this.codes();
    const j=await this.neis("mealServiceDietInfo",{ATPT_OFCDC_SC_CODE:c.o,SD_SCHUL_CODE:c.s,MLSV_YMD:date.replace(/-/g,"")});
    const rows=(j.mealServiceDietInfo?.[1]?.row||[]).map(r=>({
      type:r.MMEAL_SC_NM||"급식",
      cal:r.CAL_INFO||"",
      dishes:String(r.DDISH_NM||"").split(/<br\s*\/?>/i).map(x=>this.clean(x)).filter(Boolean)
    }));
    return (this.cache[date]=rows);
  }
};
let mealToken=0;
async function loadMeal(date){
  if(!CONFIG.SCHOOL_NAME&&!(CONFIG.NEIS_OFFICE_CODE&&CONFIG.NEIS_SCHOOL_CODE)) return;
  const tk=++mealToken;
  S.meal={date,rows:null,err:null,loading:true}; if(S.view==="home") render();
  try{ const rows=await Meal.get(date); if(tk!==mealToken) return; S.meal={date,rows,err:null,loading:false}; }
  catch(e){ if(tk!==mealToken) return; S.meal={date,rows:null,err:e.message||"급식 정보를 불러오지 못했어요.",loading:false}; }
  if(S.view==="home") render();
}

/* ---------- 시간표 (수행평가와 연결) ---------- */
const hm=t=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
function ttDay(d=new Date()){ const w=d.getDay(); return (w>=1&&w<=5)?w:null; }
const periodNo=a=>{ const m=String(a.period||"").match(/(\d)\s*교시/); return m?+m[1]:null; };
/* 그날 그 교시 칸에 해당하는 수행평가: 교시를 적었으면 그 칸, 안 적었으면 같은 과목 칸 */
function perfAt(date,i,abbr){
  return S.data.assessments.filter(a=>{
    if(a.due_date!==date) return false;
    const pn=periodNo(a);
    if(pn) return pn===i+1;
    return !!abbr&&TT_FULL[abbr]===a.subject;
  });
}
/* 기본 시간표: 관리자가 사이트에서 고친 게 있으면 그걸, 없으면 설정값 */
const TT=()=> (S.data.class_timetable[0]&&S.data.class_timetable[0].data) || CONFIG.TIMETABLE;
const TT_SUBS=()=>[...new Set([...Object.values(TT()).flat(),...Object.values(CONFIG.TIMETABLE).flat()].filter(Boolean)),"자습","휴강"];
/* 그날만 바뀐 수업 (가장 최근 기록) */
const chgAt=(date,i)=>S.data.tt_changes.find(c=>c.date===date&&c.period===i+1);
function dayList(date){
  const w=parseD(date).getDay(); const base=[...(TT()[w]||[])];
  S.data.tt_changes.filter(c=>c.date===date).forEach(c=>{ if(!chgAt(date,c.period-1)||chgAt(date,c.period-1)!==c) return; base[c.period-1]=c.subject||"휴강"; });
  for(let i=0;i<base.length;i++) if(base[i]===undefined) base[i]="";
  return base;
}
/* 이날 이 과목 수업 교시들 */
function classPeriods(date,subject){
  const list=dayList(date);
  return list.map((x,i)=>TT_FULL[x]===subject?i+1:0).filter(Boolean);
}
/* 수행평가가 끝난 시각: 적어둔 교시 → 없으면 그날 그 과목 마지막 수업 → 그것도 없으면 그날 밤 */
function perfEnd(a){
  const p=periodNo(a)||classPeriods(a.due_date,a.subject).slice(-1)[0];
  const pr=p&&CONFIG.PERIODS[p-1];
  const d=parseD(a.due_date);
  if(pr){ const [h,m]=pr[1].split(":").map(Number); d.setHours(h,m,0,0); }
  else d.setHours(23,59,59,999);
  return d;
}
const perfDone=a=>new Date()>=perfEnd(a);
const ddA=a=>(a.due_date===today()&&perfDone(a))?`<span class="dd">끝남</span>`:ddHTML(a.due_date);
const mkTag=as=>as.length?`<span class="mk ${as.every(a=>a.is_makeup)?"re":""}">${as.every(a=>a.is_makeup)?"재시험":"수행"}</span>`:"";
function ttStatus(){
  const now=new Date(), w=ttDay(now); if(!w) return {w:null};
  const list=dayList(today()), mins=now.getHours()*60+now.getMinutes();
  const last=list.reduce((a,x,i)=>x?i:a,-1);
  for(let i=0;i<=last;i++){
    const [a,b]=CONFIG.PERIODS[i];
    if(mins>=hm(a)&&mins<hm(b)) return {w,cur:i,text:`지금 <b>${i+1}교시 ${esc(list[i])}</b> · ${b}까지`};
    if(mins<hm(a)){
      const prevEnd=i?hm(CONFIG.PERIODS[i-1][1]):0, lunch=i&&hm(a)-prevEnd>=40;
      const mo=lunch?mealOrderOn(today()):null;
      const lt=lunch?`점심시간${mo?` (우리 반 ${mo.order_no}번째${mo.eat_time?" "+hhmm(mo.eat_time):""})`:""} · `:"쉬는 시간 · ";
      return {w,next:i,text:`${i===0?"":lt}다음 <b>${i+1}교시 ${esc(list[i])}</b> ${a}`};
    }
  }
  return {w,done:true,text:"오늘 수업 끝 👋"};
}
function ttCell(abbr,i,cls,as,chg){
  const tag=mkTag(as)||(chg?`<span class="mk cg">변경</span>`:""), title=as.length?as.map(a=>a.title).join(", "):chg?`변경: ${chg.note||abbr}`:(TT_FULL[abbr]||"");

  const inner=`<span class="p">${i+1}</span><span class="sj">${abbr?esc(abbr):"-"}</span>${tag}`;

  return `<div class="ttc ${abbr?"":"blank"} ${cls}" ${style} title="${esc(title)}">${inner}</div>`;
}

function weekStart(off=0){
  const d=new Date(); const w=d.getDay();
  const base=addDays(today(), w===0?1:w===6?2:1-w);   /* 주말이면 다음 주 월요일 */
  return addDays(base, off*7);
}

const CONTENT=[["assessments","수행평가"],["notes","필기"],["posts","게시판"],["photos","학급 사진"],["homework","숙제"]];
function memberStats(id,since){
  const ok=r=>r.author_id===id&&(!since||r.created_at>=since);
  const posts=CONTENT.reduce((a,[t])=>a+S.data[t].filter(ok).length,0);
  const comments=S.data.comments.filter(ok).length;
  const mine=new Set(CONTENT.flatMap(([t])=>S.data[t].filter(r=>r.author_id===id).map(r=>t+":"+r.id)));
  S.data.comments.filter(c=>c.author_id===id).forEach(c=>mine.add("comments:"+c.id));
  const got=S.data.likes.filter(l=>mine.has(l.target_table+":"+l.target_id)||(l.target_table==="profiles"&&l.target_id===id)).length;
  return {posts,comments,got};
}
function avaHTML(p){ const nm=p.nickname||"?"; return `<span class="ava" style="--h:${hueOf(p.id)}">${esc([...nm][0])}</span>`; }
const membersView = () => {
  if(!me()) return `<div class="head"><div><h1>${esc(CONFIG.SECTIONS.members)}</h1></div></div><div class="empty"><b>멤버 목록은 로그인한 친구만 볼 수 있어요</b><button class="btn" style="margin-top:10px" data-act="login">로그인</button></div>`;
  const ps=S.data.profiles, since=new Date(Date.now()-7*864e5).toISOString();

/* 평가 기준 글을 '항목 점수' 목록으로 읽기 */
function parseCriteria(txt){
  if(!txt) return {items:[],total:0,allPts:false};
  const items=txt.split(/\n|\/|\|/).map(x=>x.trim().replace(/^[-•·*\d]+[.)]?\s+/,"")).filter(Boolean).map(x=>{
    const m=x.match(/^(.*?)[\s:：\-–(]*(\d+(?:\.\d+)?)\s*점?\)?$/);
    return (m&&m[1].trim())?{name:m[1].trim(),pt:+m[2]}:{name:x,pt:null};
  });
  const allPts=items.length>0&&items.every(i=>i.pt!==null);
  return {items,allPts,total:allPts?items.reduce((a,i)=>a+i.pt,0):0};
}
function critStrip(a){
  const c=parseCriteria(a.criteria), n=(a.criteria_attachments||[]).length;
  if(!c.items.length&&!n) return "";
  let inner;
  if(c.allPts) inner=c.items.slice(0,5).map(i=>`<span class="ci">${esc(i.name)}<em>${i.pt}</em></span>`).join("")+(c.items.length>5?`<span class="ci">+${c.items.length-5}</span>`:"")+`<span class="tot">총 ${c.total}점</span>`;
  else if(c.items.length) inner=`<span class="ct">${esc(c.items.join?c.items.map(i=>i.name).join(" · "):"")}</span>`;
  else inner=`<span class="ct">채점 기준표 사진 ${n}장</span>`;
  if(c.items.length&&n) inner+=`<span class="ci">기준표 ${n}</span>`;
  return `<div class="crit"><span class="cl">평가 기준</span>${inner}</div>`;
}
function critDetail(r){
  const c=parseCriteria(r.criteria);
  let html="";
  if(c.allPts) html=`<table class="ctable"><tbody>${c.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.pt}점</td></tr>`).join("")}<tr class="total"><td>합계</td><td>${c.total}점</td></tr></tbody></table>`;
  else if(r.criteria) html=`<div class="prose">${linkify(r.criteria)}</div>`;
  html+=attHTML(r.criteria_attachments,"기준표");
  return html||`<p class="none">아직 평가 기준이 없어요.</p>`;
}

const ACCENTS=[["green","칠판","#1D5A4D"],["ocean","바다","#1F4E8C"],["sunset","노을","#A9432A"],["grape","포도","#5B3F8C"],["ink","먹","#2B3035"],["sakura","벚꽃","#B24D72"],["night","밤하늘","#2C3E73"]];
function themePref(){ let p={}; try{ p=JSON.parse(localStorage.getItem("class13-theme"))||{}; }catch(e){}
  if(p.fxOff!==undefined){ if(p.fxOff&&!p.motion) p.motion="off"; delete p.fxOff; }
  if(!["off","soft","live"].includes(p.motion)) p.motion="soft";
  return p; }
function applyTheme(p=themePref()){
  const r=document.documentElement;
  if(p.mode==="light"||p.mode==="dark") r.dataset.theme=p.mode; else delete r.dataset.theme;
  if(p.accent&&p.accent!=="green") r.dataset.accent=p.accent; else delete r.dataset.accent;
  r.dataset.preset=p.preset||"basic"; r.dataset.motion=p.motion;
}
function setTheme(k,v){ const p=themePref(), was=PRESETS.find(x=>x.k===(p.preset||"basic"))||PRESETS[0];
  if(k==="preset"){ const pr=PRESETS.find(x=>x.k===v)||PRESETS[0];
    if(was.mode&&!pr.mode){ p.mode=p.modeBefore||"system"; delete p.modeBefore; }      /* 별밤에서 나가면 원래 밝기로 */
    if(pr.mode&&!was.mode){ p.modeBefore=p.mode||"system"; }
    if(pr.mode) p.mode=pr.mode;
    p.preset=v; p.accent=pr.accent||"green"; }
  else if(k==="mode"){ p.mode=v; delete p.modeBefore;
    if(was.mode&&v!==was.mode){ p.preset="basic"; p.accent="green"; } }                 /* 별밤은 어두운 테마라, 밝게 바꾸면 기본 테마로 */
  else p[k]=v;
  try{ localStorage.setItem("class13-theme",JSON.stringify(p)); }catch(e){} applyTheme(p); openTheme(); if(k==="preset"||k==="mode"||k==="motion") applyFx(); }
function openTheme(){
  const p=themePref(), mode=p.mode||"system", acc=p.accent||"green";
  openModal(`<div class="modal-h"><h2>테마</h2><button class="close" data-act="close" aria-label="닫기">×</button></div>
  <div class="modal-b">
    <div class="fld"><span class="lb">테마</span>
      <div class="presets">${PRESETS.map(x=>`<button class="pre ${(p.preset||"basic")===x.k?"on":""}" data-act="setTheme" data-k="preset" data-v="${x.k}" aria-pressed="${(p.preset||"basic")===x.k}"><i class="pv pv-${x.k}" style="--sw:${x.sw}"></i><b>${x.n}</b><span>${x.d}</span></button>`).join("")}</div>
      ${(PRESETS.find(x=>x.k===p.preset)||{}).fx?`<div class="fld" style="margin-top:6px"><span class="lb">움직이는 효과</span>
        <div class="seg" style="align-self:flex-start">${[["off","끄기"],["soft","은은하게"],["live","생생하게"]].map(([k,v])=>`<button class="${p.motion===k?"on":""}" data-act="setTheme" data-k="motion" data-v="${k}" aria-pressed="${p.motion===k}">${v}</button>`).join("")}</div>
        <span class="hint">${{off:"배경 색만 바뀌고 아무것도 움직이지 않아요.",soft:"홈 맨 위 날짜 칸 안에서만 아주 천천히 움직여요.",live:"카드 뒤 배경 전체에서 움직여요. 글은 가리지 않아요."}[p.motion]}</span></div>`:""}
      ${p.preset==="weather"?`<span class="hint">${S.weather?`지금 안성 공도: ${esc(S.weather.name)} ${S.weather.temp}°C · 날씨가 바뀌면 효과도 바뀌어요.`:"날씨를 불러오는 중이에요…"}</span>`:""}
      ${matchMedia("(prefers-reduced-motion: reduce)").matches?`<span class="hint">기기에서 '동작 줄이기'가 켜져 있어서 효과가 멈춘 그림으로 나와요.</span>`:""}</div>
    <div class="fld"><span class="lb">화면 밝기</span>
      <div class="seg" style="align-self:flex-start">${[["system","기기 설정"],["light","라이트"],["dark","다크"]].map(([k,v])=>`<button class="${mode===k?"on":""}" data-act="setTheme" data-k="mode" data-v="${k}">${v}</button>`).join("")}</div></div>
    <div class="fld"><span class="lb">색</span>
      <div class="swatches">${ACCENTS.map(([k,n,c])=>`<button class="sw-btn ${acc===k?"on":""}" data-act="setTheme" data-k="accent" data-v="${k}" aria-pressed="${acc===k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div></div>
    <div class="fld"><span class="lb">홈 화면 (PC · 태블릿)</span>
      <div class="seg" style="align-self:flex-start">${[["comfy","넓게 보기"],["dense","한눈에 보기"]].map(([k,v])=>`<button class="${homeMode()===k?"on":""}" data-act="homeMode" data-v="${k}">${v}</button>`).join("")}</div></div>
    <p class="row-m" style="white-space:normal">테마와 홈 화면 설정은 지금 쓰는 기기에만 저장돼요.</p>
  </div>`,"sm");
}
applyTheme();

async function doDelete(btn){
  const t=btn.dataset.t, id=btn.dataset.id;
  if(btn.dataset.armed!=="1"){ btn.dataset.armed="1"; btn.textContent="한 번 더 누르면 삭제"; btn.classList.add("danger"); setTimeout(()=>{ if(btn.isConnected){btn.dataset.armed="";btn.textContent=btn.classList.contains("x")?"×":"삭제";} },3500); return; }
  const r=S.data[t].find(x=>x.id===id); if(!r) return;

    if(t==="comments"){ refreshSocial(); toast("댓글을 지웠어요"); return; }

}

function fieldHTML([name,label,kind,o={}],pre={}){
  const id="f_"+name, req=o.req?' <span class="req">*</span>':"";
  const val=pre[name] ?? (o.def==="today"?today():o.def==="tomorrow"?addDays(today(),1):/^\+\d+$/.test(o.def||"")?addDays(today(),+o.def.slice(1)):"");
  if(kind==="head") return `<div class="fhead ${o.cr?"cr":""}"><i></i>${esc(label)}</div>`;
  if(kind==="check") return `<label class="check" for="${id}"><input type="checkbox" id="${id}" name="${name}" ${pre[name]?"checked":""}>${esc(label)}</label>`;
  if(kind==="files") return `<div class="fld"><span class="lb">${esc(label)}</span>
    <div class="drop" id="drop_${name}" data-f="${name}" data-img="${o.img?1:""}">파일을 여기로 끌어오거나 <label for="${id}">파일 고르기</label><br><small>${o.img?"사진만":"사진 · PDF"}, 파일당 ${CONFIG.MAX_FILE_MB}MB까지</small>
    <input type="file" id="${id}" name="${name}" accept="${o.img?"image/*":"image/*,application/pdf"}" multiple hidden></div><div class="flist" id="flist_${name}"></div></div>`;
  let input;
  if(kind==="subject") input=`<select id="${id}" name="${name}">${SUBJECTS.map(s=>`<option ${pre.subject===s[0]?"selected":""}>${s[0]}</option>`).join("")}</select>`;
  else if(kind==="select"){ const opts=typeof o.opts==="function"?o.opts():o.opts; input=`<select id="${id}" name="${name}">${opts.map(x=>`<option ${String(pre[name]??"")===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`; }
  else if(kind==="area") input=`<textarea id="${id}" name="${name}" placeholder="${esc(o.ph||"")}" ${o.attrs||""}>${esc(val)}</textarea>`;
  else input=`<input type="${kind==="url"?"url":kind}" id="${id}" name="${name}" value="${esc(val)}" placeholder="${esc(o.ph||"")}" ${kind==="url"?'inputmode="url"':""} ${o.attrs||""}>`;
  return `<div class="fld"><label for="${id}">${esc(label)}${req}</label>${input}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:""}</div>`;
}
function openEdit(t,id){
  const r=S.data[t].find(x=>x.id===id); if(!r) return;
  const type=EDIT_TYPE[t]; if(!type) return;
  const pre={}; for(const [name,,kind] of FORMS[type].fields){ if(kind==="files") continue; pre[name]=r[name]??""; }
  if(type==="songs") pre.youtube_id=`https://youtu.be/${r.youtube_id}`;
  openCompose(type,pre,r);
}
function openCompose(type,pre={},editRow=null){
  if(!me()){ openAuth("login","글을 올리려면 먼저 로그인해 주세요."); return; }
  const spec=FORMS[type]; pending={};
  S.editing=editRow?{id:editRow.id,keep:Object.fromEntries(spec.fields.filter(f=>f[2]==="files").map(f=>[f[0],[...(editRow[f[0]]||[])]])),drop:[]}:null;
  if(S.view==="perf"&&S.perfSub!=="전체") pre.subject??=S.perfSub;
  if(S.view==="notes"&&S.noteSub!=="전체") pre.subject??=S.noteSub;
  const fs=spec.fields; let html="";
  for(let i=0;i<fs.length;i++){
    if(fs[i][3]?.half && fs[i+1]?.[3]?.half){ html+=`<div class="two">${fieldHTML(fs[i],pre)}${fieldHTML(fs[i+1],pre)}</div>`; i++; }
    else html+=fieldHTML(fs[i],pre);
  }
  openModal(`<div class="modal-h"><h2>${esc(editRow?spec.title.replace(/ ?(올리기|쓰기|추가|기록|남기기|추천)$/,"")+" 수정":spec.title)}</h2><button class="close" data-act="close" aria-label="닫기">×</button></div>
    <div class="modal-b"><form class="form" id="composeForm" data-type="${type}" novalidate>${html}<div id="formErr"></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn" id="submitBtn">${editRow?"저장":"올리기"}</button></div></form></div>`);
  if(S.editing) for(const n of Object.keys(S.editing.keep)) addFiles(n,[]);
  if(type==="assessments") bindPeriodHint();
  for(const [name,,kind] of spec.fields){
    if(kind!=="files") continue;
    pending[name]=[];
    const fi=$("#f_"+name), dz=$("#drop_"+name);
    fi.addEventListener("change",()=>{ addFiles(name,fi.files); fi.value=""; });
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");addFiles(name,e.dataTransfer.files);});
  }
}
/* 수행평가 올릴 때: 과목·날짜를 고르면 그날 그 과목 교시를 알려주고, 비어 있으면 채워줘요 */
function bindPeriodHint(){
  const sub=$("#f_subject"), dt=$("#f_due_date"), pe=$("#f_period"); if(!sub||!dt||!pe) return;
  const hint=document.createElement("span"); hint.className="hint"; hint.id="ttHint";
  pe.closest(".two")?.after(hint);
  let auto="";
  const upd=()=>{
    if(!dt.value){ hint.textContent=""; return; }
    const w=parseD(dt.value).getDay(), cps=classPeriods(dt.value,sub.value);
    const clearAuto=()=>{ if(auto&&pe.value===auto){ pe.value=""; auto=""; } };
    if(w===0||w===6){ clearAuto(); hint.textContent="주말이에요. 날짜를 확인해 주세요."; return; }
    if(!cps.length){ clearAuto(); hint.textContent=`시간표상 이날(${"일월화수목금토"[w]})엔 ${sub.value} 수업이 없어요. 교시를 직접 적어 주세요.`; return; }
    hint.textContent=`시간표상 이날 ${sub.value} 수업은 ${cps.join(", ")}교시예요.`;
    if(!pe.value.trim()||pe.value===auto){ auto=cps.length===1?`${cps[0]}교시`:""; pe.value=auto; }
  };
  sub.addEventListener("change",upd); dt.addEventListener("change",upd); dt.addEventListener("input",upd);
  pe.addEventListener("input",()=>{ if(pe.value!==auto) auto="__typed__"; });
  upd();
}
function addFiles(name,list){
  const arr=pending[name]||(pending[name]=[]);
  const imgOnly=$("#drop_"+name)?.dataset.img==="1";
  for(const f of list){
    if(imgOnly ? !/^image\//.test(f.type) : !/^image\/|^application\/pdf$/.test(f.type)){ toast(`${imgOnly?"사진만":"사진과 PDF만"} 올릴 수 있어요: ${f.name}`); continue; }
    arr.push(f);
  }
  const kept=(S.editing&&S.editing.keep[name])||[];
  $("#flist_"+name).innerHTML=kept.map((a,i)=>`<div class="fitem kept"><span>${esc(a.name)}</span><small>올려 둔 파일</small><button type="button" data-act="unkeep" data-f="${name}" data-i="${i}" aria-label="빼기">×</button></div>`).join("")
    +arr.map((f,i)=>`<div class="fitem"><span>${esc(f.name)}</span><small>${sizeTxt(f.size)}</small><button type="button" data-act="unfile" data-f="${name}" data-i="${i}" aria-label="빼기">×</button></div>`).join("");
}
async function submitCompose(form){
  const type=form.dataset.type, spec=FORMS[type], row={...(spec.fixed||{})};
  const err=m=>{ $("#formErr").innerHTML=`<div class="err">${esc(m)}</div>`; };
  for(const [name,label,kind,o={}] of spec.fields){
    if(kind==="files"||kind==="head") continue;
    const el=form.elements[name];
    const v=kind==="check"?el.checked:el.value.trim();
    if(o.req && !v) return err(`‘${label}’ 칸을 채워 주세요.`);
    row[name]= v===""?null:(kind==="number"?Number(v):o.int?parseInt(v,10):v);
    if(kind==="number"&&row[name]!=null&&(!Number.isInteger(row[name])||row[name]<1)) return err(`‘${label}’은 1 이상의 숫자로 적어 주세요.`);
  }
  if(row.url && !/^https?:\/\//i.test(row.url)) row.url="https://"+row.url;
  if(type==="songs"){ const id=ytId(row.youtube_id); if(!id) return err("유튜브 주소를 확인해 주세요. 공유 버튼으로 복사한 주소를 붙여넣으면 돼요."); row.youtube_id=id; }
  const btn=$("#submitBtn"); btn.disabled=true;
  try{
    const fileFields=spec.fields.filter(f=>f[2]==="files").map(f=>f[0]);
    const E=S.editing;
    if((type==="photos"||type==="meal_photos")&&!(pending.attachments||[]).length&&!(E&&E.keep.attachments.length)){ btn.disabled=false; return err("사진을 한 장 이상 골라 주세요."); }
    const total=fileFields.reduce((a,n)=>a+(pending[n]||[]).length,0); let done=0;
    for(const n of fileFields){
      row[n]=E?[...E.keep[n]]:[];
      for(const f of (pending[n]||[])){ done++; btn.textContent=`파일 올리는 중 ${done}/${total}`; row[n].push(await api.upload(f)); }
    }
    btn.textContent="저장 중…";
    if(E){
      await api.update(spec.table,E.id,row);
      const paths=E.drop.map(a=>a.path).filter(Boolean); if(paths.length) api.sb.storage.from("uploads").remove(paths).catch(()=>{});
      S.editing=null; await reload(spec.table); closeModal(); render(); toast("수정했어요");
    } else { await api.insert(spec.table,row); await reload(spec.table); closeModal(); render(); toast("올렸어요"); }
  }catch(e){ btn.disabled=false; btn.textContent=S.editing?"저장":"올리기"; err(e.message||"올리지 못했어요. 다시 해 주세요."); }
}

const LB={items:[],i:0};
function openGallery(el){
  const box=el.closest(".atts,.pgrid")||el.parentElement;
  const thumbs=[...box.querySelectorAll('[data-act="lightbox"]')];
  LB.items=thumbs.map(t=>({url:t.dataset.src,name:t.dataset.name}));

/* 확대: 두 손가락 벌리기 · 마우스 휠 · 두 번 탭 / 확대 중에는 끌어서 이동 */
const ZMAX=5;
LB.z={s:1,x:0,y:0};
function renderLB(){
  let d=$("#lb");
  if(!d){
    d=document.createElement("div"); d.className="lightbox"; d.id="lb";
    d.addEventListener("click",ev=>{ if(ev.target===d) d.remove(); });
    document.body.appendChild(d);
  }
  LB.z={s:1,x:0,y:0};
  const it=LB.items[LB.i], n=LB.items.length;
  d.innerHTML=`<button class="close" data-act="lbclose" aria-label="닫기">×</button>
    ${n>1?`<button class="lbnav prev" data-act="lbmove" data-v="-1" aria-label="이전 사진">${icon("left")}</button><button class="lbnav next" data-act="lbmove" data-v="1" aria-label="다음 사진">${icon("right")}</button>`:""}
    <div class="lbstage" id="lbStage"><img src="${esc(it.url)}" alt="${esc(it.name)}" draggable="false"></div>
    <div class="cap">${esc(it.name)}</div>
    <div class="lbbar">${n>1?`<span class="cnt">${LB.i+1} / ${n}</span>`:""}
      <span class="lbzoom"><button data-act="zoom" data-v="-1" aria-label="축소">−</button><span id="lbPct">100%</span><button data-act="zoom" data-v="1" aria-label="확대">+</button></span>
      ${dlBtn(it,"btn sm")}</div>
    ${n>1&&n<=12?`<div class="lbdots">${LB.items.map((_,k)=>`<i class="${k===LB.i?"on":""}"></i>`).join("")}</div>`:""}
    <div class="lbhint">${matchMedia("(pointer:coarse)").matches?"두 손가락으로 벌리거나 두 번 탭해서 확대":"휠이나 더블클릭으로 확대 · 확대 중엔 끌어서 이동"}</div>`;
  bindZoom($("#lbStage"));
}
function applyZ(){
  const st=$("#lbStage"); if(!st) return; const img=st.querySelector("img"), z=LB.z;
  const mx=img.offsetWidth*(z.s-1)/2, my=img.offsetHeight*(z.s-1)/2;
  z.x=Math.max(-mx,Math.min(mx,z.x)); z.y=Math.max(-my,Math.min(my,z.y));
  img.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`;
  st.classList.toggle("zoomed",z.s>1.01);
  const pct=$("#lbPct"); if(pct) pct.textContent=Math.round(z.s*100)+"%";
  const [m,p]=document.querySelectorAll(".lbzoom button"); if(m){ m.disabled=z.s<=1.01; p.disabled=z.s>=ZMAX-.01; }
}
function zoomAt(s,cx,cy){
  const st=$("#lbStage"); if(!st) return; const z=LB.z, r=st.getBoundingClientRect();
  s=Math.max(1,Math.min(ZMAX,s));
  if(cx==null){ cx=r.left+r.width/2; cy=r.top+r.height/2; }
  const ox=cx-(r.left+r.width/2), oy=cy-(r.top+r.height/2), k=s/z.s;
  z.x=ox-(ox-z.x)*k; z.y=oy-(oy-z.y)*k; z.s=s;
  if(s<=1.01){ z.s=1; z.x=0; z.y=0; }
  applyZ();
}
function bindZoom(st){
  const ptrs=new Map(); let start=null, pinch=null, lastTap=0, moved=false;
  st.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(LB.z.s*Math.exp(-e.deltaY*0.0018),e.clientX,e.clientY); },{passive:false});
  st.addEventListener("dblclick",e=>{ e.preventDefault(); zoomAt(LB.z.s>1.01?1:2.5,e.clientX,e.clientY); });
  st.addEventListener("pointerdown",e=>{
    st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    if(ptrs.size===1) start={x:e.clientX,y:e.clientY,zx:LB.z.x,zy:LB.z.y};
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:LB.z.s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; }
    st.classList.add("dragging");
  });
  st.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&pinch){ const [a,b]=[...ptrs.values()]; moved=true; zoomAt(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,pinch.cx,pinch.cy); return; }
    if(ptrs.size===1&&start){
      const dx=e.clientX-start.x, dy=e.clientY-start.y; if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
      if(LB.z.s>1.01){ LB.z.x=start.zx+dx; LB.z.y=start.zy+dy; applyZ(); }
    }
  });
  const end=e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size<2) pinch=null;
    if(ptrs.size===0){
      st.classList.remove("dragging");
      if(start){
        const dx=e.clientX-start.x;
        if(LB.z.s<=1.01&&Math.abs(dx)>50&&LB.items.length>1){ start=null; moveLB(dx<0?1:-1); return; }
        if(!moved&&e.pointerType!=="mouse"){ const now=Date.now(); if(now-lastTap<300){ zoomAt(LB.z.s>1.01?1:2.5,e.clientX,e.clientY); lastTap=0; } else lastTap=now; }
      }
      start=null;
    } else { const [a]=[...ptrs.values()]; start={x:a.x,y:a.y,zx:LB.z.x,zy:LB.z.y}; }
  };
  st.addEventListener("pointerup",end); st.addEventListener("pointercancel",end);
}
function moveLB(v){ const n=LB.items.length; if(n<2) return; LB.i=(LB.i+v+n)%n; renderLB(); }

/* 사진 모두 받기: 한 묶음을 zip 파일 하나로 저장 */
async function zipAll(btn){
  const box=btn.closest(".sec"); const thumbs=[...box.querySelectorAll('[data-act="lightbox"]')];
  const items=thumbs.map(t=>({url:t.dataset.src,name:t.dataset.name}));
  const label=btn.dataset.name||"사진", old=btn.innerHTML;
  btn.disabled=true;
  try{
    if(!window.JSZip) await new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=ok; s.onerror=()=>no(new Error("압축 도구를 불러오지 못했어요.")); document.head.appendChild(s); });
    const zip=new JSZip(), used={};
    for(let k=0;k<items.length;k++){
      btn.textContent=`모으는 중 ${k+1}/${items.length}`;
      const r=await fetch(items[k].url); if(!r.ok) throw new Error("사진을 받지 못했어요: "+items[k].name);
      let nm=items[k].name||`photo${k+1}.jpg`; if(used[nm]){ nm=`${k+1}_${nm}`; } used[nm]=1;
      zip.file(nm, await r.blob());
    }
    btn.textContent="압축하는 중…";
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${label.replace(/[\\/:*?"<>|]/g,"_")}.zip`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(`사진 ${items.length}장을 저장했어요`);
  }catch(e){ toast(e.message||"저장하지 못했어요"); }
  btn.disabled=false; btn.innerHTML=old;
}

const HWPX_HPF="<?xml version='1.0' encoding='UTF-8'?>\n<opf:package xmlns:ha=\"http://www.hancom.co.kr/hwpml/2011/app\" xmlns:hp=\"http://www.hancom.co.kr/hwpml/2011/paragraph\" xmlns:hp10=\"http://www.hancom.co.kr/hwpml/2016/paragraph\" xmlns:hs=\"http://www.hancom.co.kr/hwpml/2011/section\" xmlns:hc=\"http://www.hancom.co.kr/hwpml/2011/core\" xmlns:hh=\"http://www.hancom.co.kr/hwpml/2011/head\" xmlns:hhs=\"http://www.hancom.co.kr/hwpml/2011/history\" xmlns:hm=\"http://www.hancom.co.kr/hwpml/2011/master-page\" xmlns:hpf=\"http://www.hancom.co.kr/schema/2011/hpf\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:opf=\"http://www.idpf.org/2007/opf/\" xmlns:ooxmlchart=\"http://www.hancom.co.kr/hwpml/2016/ooxmlchart\" xmlns:hwpunitchar=\"http://www.hancom.co.kr/hwpml/2016/HwpUnitChar\" xmlns:epub=\"http://www.idpf.org/2007/ops\" xmlns:config=\"urn:oasis:names:tc:opendocument:xmlns:config:1.0\" version=\"\" unique-identifier=\"\" id=\"\">\n  <opf:metadata>\n    <opf:title>{{TITLE}}</opf:title>\n    <opf:language>ko</opf:language>\n    <opf:meta name=\"creator\" content=\"text\">1학년 3반 사이트</opf:meta>\n    <opf:meta name=\"subject\" content=\"text\"/>\n    <opf:meta name=\"description\" content=\"text\"/>\n    <opf:meta name=\"lastsaveby\" content=\"text\">1학년 3반 사이트</opf:meta>\n    <opf:meta name=\"CreatedDate\" content=\"text\">{{ISO}}</opf:meta>\n    <opf:meta name=\"ModifiedDate\" content=\"text\">{{ISO}}</opf:meta>\n    <opf:meta name=\"date\" content=\"text\">{{KDATE}}</opf:meta>\n    <opf:meta name=\"keyword\" content=\"text\"/>\n  </opf:metadata>\n  <opf:manifest>\n    <opf:item id=\"header\" href=\"Contents/header.xml\" media-type=\"application/xml\"/>\n    <opf:item id=\"section0\" href=\"Contents/section0.xml\" media-type=\"application/xml\"/>\n    <opf:item id=\"settings\" href=\"settings.xml\" media-type=\"application/xml\"/>\n  </opf:manifest>\n  <opf:spine>\n    <opf:itemref idref=\"header\" linear=\"yes\"/>\n    <opf:itemref idref=\"section0\" linear=\"yes\"/>\n  </opf:spine>\n</opf:package>\n";
const HWPX_PARA={center:24,left:25,right:26};

/* 자리 배치표 → 한글(hwpx) 파일 만들기 (A4 가로)
   plan = { title, subtitle, layout:"pair"|"single", boardTop:true, grid:[[cell|null(=통로)]], legend, hasFixed, hasEmpty }
   cell = { name, kind:"seat"|"fixed"|"empty" } */
async function buildSeatHwpx(plan, JSZipLib){
  const Z = JSZipLib || window.JSZip;
  const x = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  let pid = 100, tid = 900;
  const C = HWPX_PARA.center, L = HWPX_PARA.left, R = HWPX_PARA.right;
  const run = (cp, t) => `<hp:run charPrIDRef="${cp}"><hp:t>${x(t)}</hp:t></hp:run>`;
  const p = (pp, runs) => `<hp:p id="${pid++}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">${runs}</hp:p>`;
  const tc = (c, r, w, h, bf, paras, m = [200, 200, 100, 100]) =>
    `<hp:tc name="" header="0" hasMargin="1" protect="0" editable="0" dirty="1" borderFillIDRef="${bf}">` +
    `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList>` +
    `<hp:cellAddr colAddr="${c}" rowAddr="${r}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${w}" height="${h}"/>` +
    `<hp:cellMargin left="${m[0]}" right="${m[1]}" top="${m[2]}" bottom="${m[3]}"/></hp:tc>`;
  const tbl = (widths, heights, rowsXml, om = [0, 0, 120, 120]) => {
    const W = widths.reduce((a,b)=>a+b,0), H = heights.reduce((a,b)=>a+b,0);
    return p(C, `<hp:run charPrIDRef="0"><hp:tbl id="${tid++}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${heights.length}" colCnt="${widths.length}" cellSpacing="0" borderFillIDRef="4" noAdjust="0">` +
      `<hp:sz width="${W}" widthRelTo="ABSOLUTE" height="${H}" heightRelTo="ABSOLUTE" protect="0"/>` +
      `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
      `<hp:outMargin left="${om[0]}" right="${om[1]}" top="${om[2]}" bottom="${om[3]}"/><hp:inMargin left="0" right="0" top="0" bottom="0"/>` +
      rowsXml.map(r=>`<hp:tr>${r}</hp:tr>`).join("") + `</hp:tbl></hp:run>`);
  };
  const FULL = 75682;   /* A4 가로에서 좌우 여백 15mm 뺀 폭 */
  const fit = ws => { ws[ws.length-1] += FULL - ws.reduce((a,b)=>a+b,0); return ws; };

  /* 머리: 제목 + 날짜 칩, 아래 초록 줄 */
  const header = () => { const rw = 26000, lw = FULL - rw, h = 2700;
    return tbl([lw, rw], [h], [ tc(0,0,lw,h,30,p(L,run(33,plan.title)),[100,100,0,250]) + tc(1,0,rw,h,30,p(R,run(39,plan.subtitle||"")),[100,100,0,250]) ], [0,0,0,700]); };

  /* 칠판 · 교탁 (가운데) */
  const center = (w, h, bf, para, om) => { const side = (FULL - w) / 2 | 0, ws = fit([side, w, side]);
    return tbl(ws, [h], [ tc(0,0,ws[0],h,4,p(C,run(34,""))) + tc(1,0,ws[1],h,bf,para) + tc(2,0,ws[2],h,4,p(C,run(34,""))) ], om); };
  const board = () => center(46000, 2100, 28, p(C, run(32, "칠        판")), [0,0,100,100]);
  const desk  = () => center(9000, 1100, 29, p(C, run(36, "교 탁")), [0,0,100,100]);

  /* 자리 표: 책상 줄 사이에 얇은 빈 줄을 넣어 실제 교실처럼 */
  const grid = plan.grid, cols = grid[0].length, pair = plan.layout === "pair";
  const gapW = pair ? 3400 : 2400, rowGap = pair ? 500 : 400;
  const gaps = grid[0].filter(c=>c===null).length;
  const seatW = Math.floor((FULL - gaps*gapW) / (cols - gaps));
  const widths = fit(grid[0].map(c=> c===null ? gapW : seatW));
  const rowH = pair ? 5300 : 4500;
  const rowsXml = [], heights = [];
  const blank = (c, r, h) => tc(c, r, widths[c], h, 4, p(C, run(34, "")), [0,0,0,0]);
  grid.forEach((row, i) => {
    if (i) { const r = rowsXml.length; rowsXml.push(row.map((_, c) => blank(c, r, rowGap)).join("")); heights.push(rowGap); }
    const r = rowsXml.length;
    rowsXml.push(row.map((cell, c) => {
      if (cell === null) return blank(c, r, rowH);
      if (cell.kind === "empty") return tc(c, r, widths[c], rowH, 27, p(C, run(35, "빈자리")));
      if (cell.kind === "fixed") return tc(c, r, widths[c], rowH, 26, p(C, run(37, cell.name || "")) + p(C, run(38, "고정석")));
      return tc(c, r, widths[c], rowH, 25, p(C, run(30, cell.name || "")));
    }).join(""));
    heights.push(rowH);
  });
  const seats = tbl(widths, heights, rowsXml, [0,0,200,200]);

  /* 아래 범례 */
  const legend = () => { const sw = 1100, tw = 3400, h = 900, ws = [], cells = [];
    const add = (w, bf, para) => { ws.push(w); cells.push([w, bf, para]); };
    if (plan.hasFixed) { add(sw, 26, p(C, run(34, ""))); add(tw, 4, p(L, run(34, "고정석"))); }
    if (plan.hasEmpty) { add(sw, 27, p(C, run(34, ""))); add(tw, 4, p(L, run(34, "빈자리"))); }
    add(FULL - ws.reduce((a,b)=>a+b,0), 4, p(R, run(34, plan.legend || "")));
    return tbl(ws, [h], [ cells.map(([w, bf, para], c) => tc(c, 0, w, h, bf, para, [200,200,0,0])).join("") ], [0,0,300,0]); };

  const parts = [ header(), ...(plan.boardTop ? [board(), desk(), seats] : [seats, desk(), board()]), legend() ];
  const section = HWPX_SEC_HEAD + parts.join("") + "</hs:sec>";

  const now = new Date(), iso = now.toISOString().replace(/\.\d+Z$/,"Z");
  const kdate = `${now.getFullYear()}년 ${String(now.getMonth()+1).padStart(2,"0")}월 ${String(now.getDate()).padStart(2,"0")}일`;
  const zip = await Z.loadAsync(HWPX_TPL, { base64: true });
  zip.file("mimetype", "application/hwp+zip", { compression: "STORE" });
  zip.file("Contents/content.hpf", HWPX_HPF.replace("{{TITLE}}", x(plan.title)).replaceAll("{{ISO}}", iso).replace("{{KDATE}}", kdate), { createFolders: false });
  zip.file("Contents/section0.xml", section, { createFolders: false });
  zip.file("Preview/PrvText.txt", [plan.title, plan.subtitle, ...grid.map(r=>r.map(c=>c?(c.name||"빈자리"):"|").join(" "))].join("\r\n"), { createFolders: false });
  return zip.generateAsync({ type: (typeof window==="undefined") ? "nodebuffer" : "blob", compression: "DEFLATE", mimeType: "application/hwp+zip" });
}

/* ======================================================================
   우리 반 ① 자리 배치 (랜덤 · 고정석 · 두 가지 배열 · 한 명씩 뽑기 · 한글 저장)
   명단은 로그인한 친구만 볼 수 있는 서버 표(class_roster)에서 불러와요.
   ====================================================================== */
const SEAT_LAYOUTS={ pair:{name:"짝꿍 배치",desc:"3분단 · 2명씩 · 6줄"}, single:{name:"한 줄 배치",desc:"5줄 · 1명씩 · 7칸"} };
function seatGrid(layout){
  const rows=[];
  if(layout==="pair"){ for(let r=0;r<6;r++){ const row=[]; for(let g=0;g<3;g++){ for(let s=0;s<2;s++) row.push({id:`p${g}${r}${s}`,label:`${"ABC"[g]}${r+1}-${s+1}`}); if(g<2) row.push(null); } rows.push(row); } }
  else { for(let r=0;r<7;r++){ const row=[]; for(let c=0;c<5;c++){ row.push({id:`s${c}${r}`,label:`${c+1}-${r+1}`}); if(c<4) row.push(null); } rows.push(row); } }
  return rows;
}
const seatIds=layout=>seatGrid(layout).flat().filter(Boolean).map(c=>c.id);
const seatLabel=id=>(seatGrid(id[0]==="p"?"pair":"single").flat().find(c=>c&&c.id===id)||{}).label||id;
const shuffleArr=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rosterName=no=>(S.data.class_roster.find(r=>r.no===no)||{}).name||"";
const isSeatAdmin=()=>me()?.role==="admin";
/* 저장된 설정(서버) + 관리자가 고치는 중인 설정 */
function seatSaved(){ return (S.data.seat_plan[0]&&S.data.seat_plan[0].data)||{}; }
function seatCfg(){ if(!S.seat.cfg) S.seat.cfg=JSON.parse(JSON.stringify(seatSaved())); return S.seat.cfg; }
function seatStudents(cfg=seatCfg()){ const ex=new Set(cfg.exclude||[]); return S.data.class_roster.filter(r=>r.active!==false&&!ex.has(r.no)).map(r=>r.no); }
function pairSet(a){ const by={}; for(const [id,n] of Object.entries(a||{})){ if(id[0]!=="p") continue; (by[id.slice(0,3)]=by[id.slice(0,3)]||[]).push(n); } return new Set(Object.values(by).filter(x=>x.length===2).map(x=>[...x].sort((p,q)=>p-q).join("-"))); }
function makeAssign(layout,cfg){
  const ids=seatIds(layout), studs=seatStudents(cfg);
  const fSeats=((cfg.fixedSeats||{})[layout]||[]).filter(id=>ids.includes(id));
  const fStud=(cfg.fixedStudents||[]).filter(n=>studs.includes(n));
  if(fStud.length>fSeats.length) throw new Error(`고정석 학생은 ${fStud.length}명인데 ${SEAT_LAYOUTS[layout].name}의 고정석은 ${fSeats.length}자리예요. 고정석 · 명단 설정에서 자리를 더 골라 주세요.`);
  const others=studs.filter(n=>!fStud.includes(n));
  const one=()=>{
    const a={}, fs=shuffleArr(fSeats);
    shuffleArr(fStud).forEach((n,i)=>a[fs[i]]=n);              /* 고정석 학생끼리 고정석 안에서 랜덤 */
    const free=shuffleArr(ids.filter(id=>!(id in a)));          /* 남는 자리(빈자리 포함)도 랜덤 */
    if(others.length>free.length) throw new Error(`${studs.length}명이 앉기엔 자리가 부족해요.`);
    shuffleArr(others).forEach((n,i)=>a[free[i]]=n);
    return a;
  };
  const prev=seatSaved().layout==="pair"?seatSaved().assign:null;
  if(layout!=="pair"||!cfg.avoidPrev||!prev) return one();
  const pp=pairSet(prev); let best=null,bs=1e9;
  for(let k=0;k<400&&bs>0;k++){ const a=one(); const sc=[...pairSet(a)].filter(p=>pp.has(p)).length; if(sc<bs){ bs=sc; best=a; } }
  S.seat.repeatPairs=bs; return best;
}
function seatLayoutNow(){ return S.seat.layout||seatSaved().layout||"pair"; }
function seatAssignNow(){
  const L=seatLayoutNow();
  if(S.seat.assign) return S.seat.assign;
  const sv=seatSaved(); return sv.layout===L&&sv.assign?sv.assign:{};
}
function myRosterNo(){ const nm=(me()?.nickname||"").replace(/\s/g,""); const r=S.data.class_roster.find(x=>x.name===nm); return r?r.no:null; }

function seatCellHTML(c,assign,cfg,L){
  const no=assign[c.id], name=no?rosterName(no):"";
  const fixed=((cfg.fixedSeats||{})[L]||[]).includes(c.id);
  const q=(S.seat.find||"").trim(), hit=q&&name.includes(q), mine=no&&no===myRosterNo();
  const sel=S.seat.pick===c.id, has=Object.keys(assign).length>0;
  const cls=["seat",fixed?"fixed":"",has&&!no?"empty":"",hit?"hit":"",mine?"mine":"",sel?"pick":"",S.seat.flash===c.id?"pop":""].join(" ");
  return `<button class="${cls}" data-act="seatClick" data-id="${c.id}" aria-label="${esc(c.label)} ${esc(name||(has?"빈자리":"자리"))}">
    <span class="sl">${esc(c.label)}${fixed?" · 고정":""}</span><span class="sn">${name?esc(name):has?"빈자리":"·"}</span></button>`;
}
function seatBoardHTML(top){
  const board=`<div class="sboard">칠 판</div><div class="sdesk"><span>교탁</span></div>`;
  return top?board:`<div class="sflip">${`<div class="sdesk"><span>교탁</span></div><div class="sboard">칠 판</div>`}</div>`;
}
function seatGridHTML(L,assign,cfg){
  let rows=seatGrid(L); const top=S.seat.boardTop!==false;
  if(!top) rows=rows.slice().reverse().map(r=>r.slice().reverse());
  const tpl=rows[0].map(c=>c?"minmax(0,1fr)":(L==="pair"?"clamp(10px,3vw,30px)":"clamp(6px,1.6vw,18px)")).join(" ");
  return `<div class="seatwrap ${L}">${top?seatBoardHTML(true):""}
    <div class="seatgrid" style="grid-template-columns:${tpl}">${rows.map(r=>r.map(c=>c?seatCellHTML(c,assign,cfg,L):`<span class="aisle" aria-hidden="true"></span>`).join("")).join("")}</div>
    ${top?"":seatBoardHTML(false)}</div>`;
}
/* 자리 바꾸기: 두 자리 맞바꾸기 · 모두 지우기 · 남은 학생 직접 앉히기 */
function seatSwapBar(assign,cfg){
  const st=S.seat, seated=new Set(Object.values(assign)), left=seatStudents(cfg).filter(n=>!seated.has(n));
  const msg=st.pickStu?`<b>${esc(rosterName(st.pickStu))}</b>을(를) 앉힐 자리를 눌러 주세요.`
    : st.pick?`<b>${esc(seatLabel(st.pick))}</b>와 바꿀 자리를 눌러 주세요.${assign[st.pick]?"":" (빈자리로 옮길 수도 있어요)"}`
    : left.length?"아래 이름을 누르고 자리를 누르면 앉혀져요. 앉은 두 자리를 누르면 서로 바뀌어요.":"바꿀 두 자리를 차례로 눌러 주세요.";
  return `<div class="sedit">${icon("check")}<span class="sedit-t">${msg}</span>
    ${st.pick&&assign[st.pick]?`<button class="btn ghost sm" data-act="seatUnseat">이 자리 비우기</button>`:""}
    ${Object.keys(assign).length?`<button class="btn ghost sm ${st.clearArm?"danger":""}" data-act="seatClearAll">${st.clearArm?"한 번 더 누르면 모두 지워져요":"모두 지우기"}</button>`:""}
    <button class="btn sm" data-act="seatSwapDone">완료</button></div>
  ${left.length?`<div class="stray"><span class="stray-h">아직 안 앉은 학생 <b>${left.length}명</b></span>${left.map(n=>`<button class="stu ${st.pickStu===n?"on":""}" data-act="seatPickStu" data-no="${n}">${esc(rosterName(n))}</button>`).join("")}</div>`:""}`;
}
function seatView(){
  if(!me()) return `<div class="empty"><b>자리 배치는 로그인한 친구만 볼 수 있어요</b><button class="btn" style="margin-top:10px" data-act="login">로그인</button></div>`;
  if(!S.data.class_roster.length) return `<div class="empty"><b>아직 반 명단이 없어요</b>관리자가 Supabase에서 <code>update_1106.sql</code>을 실행하면 35명 명단이 들어가요.</div>`;
  const L=seatLayoutNow(), cfg=seatCfg(), assign=seatAssignNow(), sv=seatSaved(), st=S.seat;
  const studs=seatStudents(cfg).length, ids=seatIds(L), fixedN=((cfg.fixedSeats||{})[L]||[]).length;
  const savedHere=!st.assign&&sv.layout===L&&sv.assign;
  const status = st.revealing ? `<span class="sbadge live">뽑는 중 ${st.revealing.i}/${st.revealing.order.length}</span>`
    : st.assign ? `<span class="sbadge">연습 뽑기 · 아직 확정 전</span>${st.repeatPairs!=null&&L==="pair"&&cfg.avoidPrev?`<span class="sbadge soft">지난 짝과 겹침 ${st.repeatPairs}쌍</span>`:""}`
    : savedHere ? `<span class="sbadge ok">${sv.savedAt?fmtD(sv.savedAt.slice(0,10))+" ":""}확정된 자리</span>` : `<span class="sbadge soft">아직 뽑지 않았어요</span>`;
  const edit=st.edit==="fixed"?`<div class="sedit">${icon("check")}<span>고정석으로 쓸 자리를 눌러 주세요. 지금 <b>${fixedN}자리</b> · 고정석 학생 <b>${(cfg.fixedStudents||[]).length}명</b></span><button class="btn sm" data-act="seatFixedDone">완료</button></div>`
    : st.edit==="swap"?seatSwapBar(assign,cfg):"";
  return `
  <div class="seattools">

  const names=S.data.class_roster.map(r=>r.name), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Claude 셰프 별점: 메뉴 이름만 보고 매기는 재미용 점수예요 */
const CHEF_LOVE=[["치킨",1.1],["까스",1],["가스",1],["떡볶이",1],["피자",1.1],["버거",1],["탕수",1],["강정",.9],["스파게티",.9],["파스타",.9],["짜장",.8],["짬뽕",.7],["갈비",.9],["불고기",.7],["제육",.7],["삼겹",.8],["스테이크",1.1],["마라",.8],["핫도그",.8],["만두",.5],["카레",.5],["오므라이스",.6],["떡갈비",.7],["케이크",.9],["브라우니",.8],["아이스",.8],["샤베트",.6],["츄러스",.8],["와플",.6],["과일",.3],["요구르트",.3],["주스",.3],["에이드",.4]];
const CHEF_MEH=[["나물",-.2],["무침",-.15],["시래기",-.3],["우거지",-.2],["콩자반",-.3],["멸치",-.15],["건강",-.2],["잡곡",-.05]];
function chefRate(rows){
  const all=rows.flatMap(r=>r.dishes); if(!all.length) return null;
  let s=2.9, best=null, bv=0;
  for(const d of all){ for(const [k,v] of CHEF_LOVE) if(d.includes(k)){ s+=v*.55; if(v>bv){ bv=v; best=d; } } for(const [k,v] of CHEF_MEH) if(d.includes(k)) s+=v; }
  if(all.length>=6) s+=.2;
  const stars=Math.max(2,Math.min(5,Math.round(s*2)/2));
  const lines = stars>=4.5?[`${best||all[1]||all[0]} 등장! 4교시가 길게 느껴질 예정이에요.`,`오늘은 줄이 빨리 줄어들 것 같은 메뉴예요.`]
    : stars>=3.5?[`${best||all[1]||all[0]} 덕분에 평균 이상! 든든하게 먹고 5교시 버티기.`,`무난하게 맛있는 조합이에요.`]
    : stars>=3?[`밸런스 좋은 건강식이에요. 국물까지 챙겨 먹으면 완벽.`,`평범하지만 배는 확실히 채워 줄 메뉴예요.`]
    : [`몸에는 좋은 메뉴! 매점은 참아 봐요.`,`건강을 챙기는 날이에요. 내일을 기대해 봐요.`];
  return {stars, comment:lines[(all.join("").length)%lines.length]};
}

async function submitMyInfo(){
  const err=m=>{ $("#formErr").innerHTML=`<div class="err">${esc(m)}</div>`; };
  const nick=$("#mi_nick").value.trim(), bm=+$("#mi_bm").value, bd=+$("#mi_bd").value, pw=$("#mi_pw").value, pw2=$("#mi_pw2").value;
  if(!nick) return err("이름을 적어 주세요.");
  if(bm&&!bd) return err("생일 날짜(일)를 골라 주세요.");
  if(bm&&bd>new Date(2024,bm,0).getDate()) return err(`${bm}월에는 ${bd}일이 없어요.`);
  if(pw||pw2){ if(pw.length<6) return err("비밀번호는 6자 이상이에요."); if(pw!==pw2) return err("새 비밀번호 두 칸이 서로 달라요."); }
  const btn=$("#miBtn"); btn.disabled=true;
  try{
    if(nick!==me().nickname){ const {error}=await api.sb.from("profiles").update({nickname:nick}).eq("id",me().id); if(error) throw new Error("이름을 바꾸지 못했어요."); me().nickname=nick; }
    const md=bm?`${String(bm).padStart(2,"0")}-${String(bd).padStart(2,"0")}`:"";
    if(md!==bdayOf(me().id)){
      const q=api.sb.from("birthdays");
      const {error}= md ? await q.upsert({user_id:me().id,md},{onConflict:"user_id"}) : await q.delete().eq("user_id",me().id);
      if(error) throw new Error("생일을 저장하지 못했어요.");
    }
    if(pw){ const {error}=await api.sb.auth.updateUser({password:pw}); if(error) throw new Error("비밀번호를 바꾸지 못했어요: "+error.message); }
    await Promise.all([reload("profiles"),reload("birthdays")]); closeModal(); toast(pw?"저장했어요. 다음부터 새 비밀번호로 로그인해요":"저장했어요");
  }catch(e){ btn.disabled=false; err(e.message); }
}

function ytId(s){ s=String(s||"").trim(); if(/^[\w-]{11}$/.test(s)) return s;

function songPool(){ const rec=[...S.data.songs].sort((a,b)=>a.created_at<b.created_at?-1:1); return rec.length?rec:DEFAULT_SONGS; }
function songOfDay(){ const pool=songPool(), n=Math.round((parseD(today())-new Date(2026,0,1))/864e5); return pool[((n%pool.length)+pool.length)%pool.length]; }
/* 노래는 화면 아래 작은 플레이어에서 재생돼요.
   페이지를 다시 그려도(다른 걸 눌러도) 플레이어는 건드리지 않아서, 저절로 다시 재생되지 않아요. */
function playerHTML(s,big){
  const id=s.youtube_id, playing=S.playing===id;
  return `<div class="yt ${big?"big":""} ${playing?"on":""}" id="yt_${id}">${playing

    :`<button class="ytthumb" data-act="playSong" data-id="${id}" aria-label="${esc(s.title)} 재생"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><span class="ytplay">▶</span></button>`}</div>`;
}
function songById(id){ return [...S.data.songs,...DEFAULT_SONGS].find(x=>x.youtube_id===id)||{youtube_id:id,title:"노래"}; }
function playSong(id){
  const s=songById(id); S.playing=id;

  mp.innerHTML=`<div class="mp-h"><span class="mp-t"><b>${esc(s.title)}</b>${s.artist?` · ${esc(s.artist)}`:""}</span>

  render();
}
function stopSong(){ const mp=document.getElementById("miniPlayer"); if(mp) mp.remove(); S.playing=null; render(); }
